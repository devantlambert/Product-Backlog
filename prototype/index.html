<title>Roadmap by Dev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Dev brand tokens v1.0.0 (Roadmap). Layout: sticky app header over one working canvas, max 1200 px; project detail opens as a floating right-hand panel. */
:root{
  /* primitives */
  --dev-paper:#F6F3EC; --dev-white:#FFFFFF; --dev-paper-line:#DED8CB; --dev-ink:#1F2A24; --dev-moss:#5E665F;
  --dev-forest:#2D6A4F; --dev-slate:#3A5BA0; --dev-plum:#7B4B94; --dev-clay:#A3552A; --dev-teal:#1F7A75; --dev-gold:#9C7A12;
  --dev-leaf:#2F7D32; --dev-amber:#8A5C00; --dev-brick:#B3261E;
  /* semantic */
  --bg:var(--dev-paper); --surface:var(--dev-white); --sunk:#EFEBE1; --line:var(--dev-paper-line); --fg:var(--dev-ink); --muted:var(--dev-moss);
  --brand:var(--dev-forest); --accent:var(--dev-slate); --accent-ink:#FFFFFF; --accent-soft:#E6EAF3;
  --ok:var(--dev-leaf); --ok-soft:#E3EFE1; --warn:var(--dev-amber); --warn-soft:#F4EAD3; --bad:var(--dev-brick); --bad-soft:#F6E1DD;
  --s-intake:var(--dev-moss); --s-discovery:var(--dev-plum); --s-ready:var(--dev-slate); --s-dev:var(--dev-gold); --s-uat:var(--dev-teal); --s-released:var(--dev-leaf); --s-review:var(--dev-clay);
  --chip-bg:12%; --bar-ink:#FFFFFF;
  --float-shadow:0 8px 28px rgba(31,42,36,.16);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-sm:4px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A17; --surface:#1C231F; --sunk:#18201C; --line:#323C36; --fg:#ECE8DF; --muted:#A3ABA4;
  --brand:#6FBF94; --accent:#8FA8DD; --accent-ink:#141A17; --accent-soft:#25304A;
  --ok:#7CC97F; --ok-soft:#1F3321; --warn:#E0B04A; --warn-soft:#3A2F15; --bad:#F08A7E; --bad-soft:#3E211D;
  --s-intake:#A3ABA4; --s-discovery:#C39BD8; --s-ready:#8FA8DD; --s-dev:#D9B64A; --s-uat:#6CC3BC; --s-released:#7CC97F; --s-review:#E39368;
  --chip-bg:18%; --bar-ink:#141A17; --float-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1C231F; --sunk:#18201C; --line:#323C36; --fg:#ECE8DF; --muted:#A3ABA4;
  --brand:#6FBF94; --accent:#8FA8DD; --accent-ink:#141A17; --accent-soft:#25304A;
  --ok:#7CC97F; --ok-soft:#1F3321; --warn:#E0B04A; --warn-soft:#3A2F15; --bad:#F08A7E; --bad-soft:#3E211D;
  --s-intake:#A3ABA4; --s-discovery:#C39BD8; --s-ready:#8FA8DD; --s-dev:#D9B64A; --s-uat:#6CC3BC; --s-released:#7CC97F; --s-review:#E39368;
  --chip-bg:18%; --bar-ink:#141A17; --float-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:24px;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:40px} h2{font-size:20px;line-height:28px} h3{font-size:16px;line-height:24px}
a{color:var(--accent)}
b,strong{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.dev-date{white-space:nowrap;font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1232px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.btn,nav.views a,.card,select,input{transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}}

/* app header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px;line-height:28px}
.brand svg{flex:none;display:block}
nav.views{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
nav.views a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
nav.views a:hover{color:var(--fg)}
nav.views a[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.rolebox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=url],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-height:40px;min-width:0;font-size:14px}
select:hover,input:hover{border-color:var(--muted)}
textarea{width:100%;resize:vertical;padding:8px 12px;line-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 16px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:0 8px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
@media (pointer:coarse){.btn,select,input[type=text],input[type=number],input[type=url],nav.views a{min-height:44px}}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{padding-block:32px 64px}
.viewhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.rolenote{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-left:0;background:var(--surface);border-radius:var(--r);padding:12px 16px;margin-bottom:24px;font-size:14px;line-height:20px}
.rolenote b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 0}
.panel .body{padding:12px 16px 16px}
.label{font-size:12px;line-height:16px;color:var(--muted);font-weight:600}

/* stage tag (radius 4, always with its word) */
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;padding:2px 8px 2px 6px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--sc) var(--chip-bg),transparent);color:var(--fg)}
.stage::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--sunk);color:var(--muted)}

/* home */
.pipeline{display:flex;flex-wrap:wrap;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.pipeline a{flex:var(--n) 1 0;min-width:96px;padding:12px;text-decoration:none;color:var(--fg);border-top:4px solid var(--sc);border-right:1px solid var(--line)}
.pipeline a:last-child{border-right:0}
.pipeline a:hover{background:var(--sunk)}
.pipeline b{display:block;font-size:24px;line-height:32px;font-variant-numeric:tabular-nums}
.pipeline span{font-size:12px;line-height:16px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px;margin-top:24px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px}
.list li:first-child{border-top:0}
.list .t{min-width:0}
.list .t a{font-weight:600;text-decoration:none;color:var(--fg)}
.list .t a:hover{color:var(--accent);text-decoration:underline}
.list .t div{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.list .r{text-align:right;flex:none;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:16px}
.kpis div b{display:block;font-size:20px;line-height:28px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:8px 0;margin:0}

/* table (one step tighter) */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:1040px;font-size:14px;line-height:20px}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:12px;line-height:16px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.rank{width:64px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
td .name{font-weight:600;color:var(--fg);text-decoration:none}
td .name:hover{color:var(--accent);text-decoration:underline}
td .sub{font-size:12px;line-height:16px;color:var(--muted)}
.right{text-align:right}
td.right,.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.moves{display:inline-flex;flex-direction:column;margin-right:4px;vertical-align:middle}
.moves button{border:0;background:none;cursor:pointer;color:var(--muted);line-height:0;padding:1px 2px;border-radius:var(--r-sm)}
.moves button:hover{color:var(--accent);background:var(--sunk)}
.moves .ico{width:16px;height:16px}
tr.section td{background:var(--sunk);font-size:12px;line-height:16px;font-weight:600;color:var(--muted)}
.deps{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 6px;white-space:nowrap}
.dots{display:inline-flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.dots i.done{background:var(--ok);border-color:var(--ok)} .dots i.prog{background:var(--warn);border-color:var(--warn)} .dots i.late{background:var(--bad);border-color:var(--bad)} .dots i.na{opacity:.35}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px;border-top:4px solid var(--sc)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{display:flex;justify-content:space-between;font-size:14px;line-height:20px;margin-bottom:12px}
.col h3 span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;display:grid;gap:8px;font-size:14px;line-height:20px}
.card:hover{border-color:var(--muted)}
.card[draggable="true"]{cursor:grab}
.card .t{font-weight:600}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted)}

/* timeline */
.tl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl-inner{position:relative}
.tl-row{display:flex;height:40px;border-top:1px solid var(--line)}
.tl-row.head{height:48px;border-top:0;background:var(--sunk)}
.tl-name{position:sticky;left:0;z-index:3;flex:none;width:var(--namew);background:var(--surface);border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14px;overflow:hidden;white-space:nowrap}
.tl-row.head .tl-name{background:var(--sunk)}
.tl-name a{color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.tl-name a:hover{color:var(--accent);text-decoration:underline}
.tl-name .rk{color:var(--muted);font-size:12px;width:20px;font-variant-numeric:tabular-nums}
.tl-track{position:relative;flex:none}
.tl-month{position:absolute;top:4px;font-size:12px;line-height:16px;font-weight:600;color:var(--muted);padding-left:4px;border-left:1px solid var(--line);height:40px}
.tl-wk{position:absolute;bottom:4px;font-size:11px;line-height:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.6}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.bar{position:absolute;top:9px;height:22px;border-radius:var(--r-sm);background:var(--sc);color:var(--bar-ink);font-size:12px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:2}
.bar.inprog{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bar-ink) 22%,transparent) 0 6px,transparent 6px 12px)}
.bar-after{position:absolute;top:10px;font-size:12px;line-height:20px;color:var(--muted);white-space:nowrap;z-index:2}
.tl svg.links{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.bar.uat{opacity:.35;z-index:1}
.tl{--namew:224px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:12px;line-height:16px;color:var(--muted)}

/* capacity */
.capgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px}
@media (max-width:820px){.capgrid{grid-template-columns:1fr}}
.field{display:grid;gap:4px;margin-bottom:16px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;line-height:16px;color:var(--muted)}
.big{font-size:32px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.util{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);padding-top:12px;overflow-x:auto}
.util div{flex:1 0 8px;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.util div.free{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.utilx{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.prose{font-size:14px;line-height:20px;color:var(--muted);margin:12px 0 0}

/* alerts */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix table{min-width:800px}
.matrix input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.matrix tr.me td{background:var(--accent-soft)}
.feed li{align-items:flex-start}
.feed .when{font-size:12px;color:var(--muted)}

/* floating detail panel: the only place with a shadow */
#scrim{position:fixed;inset:0;background:rgba(20,26,23,.4);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100%);background:var(--bg);z-index:41;box-shadow:var(--float-shadow);border-left:1px solid var(--line);overflow-y:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 24px;z-index:2;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dh h2{font-size:24px;line-height:32px}
.dh .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.db{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.db > *{min-width:0}
.stepper{display:flex;flex-wrap:wrap;gap:4px;counter-reset:st}
.stepper button{flex:1 0 auto;display:flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.stepper button::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:18px;height:18px;border-radius:var(--r-sm);background:var(--sunk);font-size:11px;font-variant-numeric:tabular-nums}
.stepper button.past{color:var(--fg)}
.stepper button.past::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.stepper button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper button.cur::before{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.stepper button:not([disabled]):not(.cur):hover{border-color:var(--muted)}
.stepper button[disabled]{cursor:default}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.facts .v{font-weight:600;margin-top:4px;font-size:14px}
.facts input,.facts select{width:100%}
.dtable{width:100%;min-width:720px;table-layout:fixed}
.dtable th:nth-child(1){width:22%}.dtable th:nth-child(2){width:15%}.dtable th:nth-child(3){width:15%}.dtable th:nth-child(4){width:14%}.dtable th:nth-child(5){width:34%}
.dtable td{overflow:hidden}
.dtable select{width:100%}
.linktext{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:16px}
.filters .f{display:grid;gap:4px}
.filters .f label,.filters .f .label{font-size:12px;line-height:16px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;min-height:40px;padding:0 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.filters .count{font-size:12px;line-height:16px;color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.deptag{display:inline-block;font-size:11px;line-height:16px;font-weight:600;padding:0 4px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.deprows{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.deprows li{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 12px;font-size:14px;line-height:20px;background:var(--surface)}
.deprows li > span{min-width:0}
.deprows a{font-weight:600}
.depform{display:grid;gap:8px;margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:var(--r)}
.depform .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.depform select{max-width:100%}
.depform .preview{font-size:12px;line-height:16px;color:var(--muted)}
.dtable input[type=url]{width:100%}
.hist li{font-size:14px}
.close{display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:40px;height:40px;cursor:pointer;flex:none;color:var(--fg)}
.close:hover{border-color:var(--muted)}
.p-name{font-weight:600;font-size:20px!important;width:100%}

// ---------- reference data ----------
const STAGES=[

const ACTIVE=new Set(['dev','uat']);

  {id:'pra',name:'Post-release Analysis', team:'Product & Analytics',lateAt:null,     when:'During Post-release Review'}];
const DSTATUS=[['none','Not started'],['prog','In progress'],['done','Done'],['na','Not needed']];
const ROLES=[

  {id:'dev',      name:'Head of Development',edit:true,  home:'capacity', note:'You can edit everything. Capacity and estimates drive every forecast date.'},

const DEP_TYPES=[
  {id:'FS',name:'Finish to start',on:'released',then:'start'},

const BF0={sec:'all',stage:'',start:'',rel:'',health:''};
let BF={...BF0}; try{BF={...BF0,...JSON.parse(localStorage.getItem('roadmap-filters')||'{}')}}catch(e){}
const saveBF=()=>{try{localStorage.setItem('roadmap-filters',JSON.stringify(BF))}catch(e){}};
const bfActive=()=>Object.keys(BF0).some(k=>BF[k]!==BF0[k]);
const healthKey=p=>!p.budget?'nobudget':!p.spent?'nospend':p.spent>p.budget?'over':p.spent/p.budget>=.9?'high':'ok';
const HEALTH_OPTS=[['ok','Under 90% used'],['high','90% or more used'],['over','Over budget'],['nospend','No spend yet'],['nobudget','No budget']];
const START_OPTS=[['flight','In flight'],['w4','Within 4 weeks'],['m3','Within 3 months'],['m6','Within 6 months'],['later','More than 6 months out'],['none','Can\'t be scheduled']];
const REL_OPTS=[['w4','Within 4 weeks'],['m3','Within 3 months'],['m6','Within 6 months'],['later','More than 6 months out'],['none','Can\'t be scheduled'],['shipped','Already shipped']];
function inWindow(key,w){return key==='w4'?w<4:key==='m3'?w<13:key==='m6'?w<26:key==='later'?w>=26:true}
function bfMatch(p,f,sec){
  if(BF.sec!=='all'&&BF.sec!==sec)return false;
  if(BF.stage&&p.stage!==BF.stage)return false;
  if(BF.health&&healthKey(p)!==BF.health)return false;
  const shipped=sec==='shipped';
  if(BF.start){
    if(shipped)return false;
    if(BF.start==='flight'){if(!f.inflight)return false}
    else if(BF.start==='none'){if(!f.unsched)return false}
    else if(f.inflight||f.start==null||!inWindow(BF.start,f.start))return false;
  }
  if(BF.rel){
    if(BF.rel==='shipped'){if(!shipped)return false}
    else if(shipped)return false;
    else if(BF.rel==='none'){if(!f.unsched)return false}
    else if(f.finish==null||!inWindow(BF.rel,relW(f)))return false;
  }
  return true;
}
let depDraft={type:'FS',id:'',then:'start',on:'uat'};
const VIEWS=[['home','Home'],['backlog','Backlog'],['board','Stages'],['timeline','Timeline'],['capacity','Capacity'],['alerts','Alerts']];

// ---------- sample data (fictional) ----------
function d(daysAgo){const t=new Date();t.setDate(t.getDate()-daysAgo);return t.toISOString().slice(0,10)}
function del(ps,sys,uat,mkt,pra){const s={ps,sys,uat,mkt,pra};const o={};for(const k in s)o[k]={status:s[k]||'none',link:s[k]==='done'||s[k]==='prog'?'https://docs.example.com/'+k:''};return o}
function seed(){
  const P=(id,name,stage,o)=>Object.assign({id,name,stage,progress:0,owner:'Jordan K.',budget:0,spent:0,committed:false,estimate:0,maxDevs:3,deps:[],summary:'',history:[]},o);
  const projects=[

    P(4,'Mobile offline mode','dev',{progress:20,owner:'Marcus T.',budget:32,spent:7,committed:true,estimate:30,maxDevs:3,summary:'Field users can view and edit records without a connection; changes sync when back online.',deliverables:del('done','none','none','none','none'),history:[{date:d(80),to:'discovery'},{date:d(35),to:'ready'},{date:d(14),to:'dev'}]}),
    P(6,'Public API v2','ready',{owner:'Priya S.',budget:25,spent:0,committed:true,estimate:28,maxDevs:4,summary:'Versioned REST API with consistent pagination, webhooks and scoped API keys.',deliverables:del('done','none','none','none','none'),history:[{date:d(50),to:'discovery'},{date:d(9),to:'ready'}]}),
    P(9,'Roles and permissions 2.0','ready',{owner:'Jordan K.',budget:22,spent:0,committed:true,estimate:20,maxDevs:3,deps:[{id:2,on:'released',then:'start'}],summary:'Custom roles with granular permissions, mapped to identity-provider groups.',deliverables:del('done','none','none','none','none'),history:[{date:d(45),to:'discovery'},{date:d(12),to:'ready'}]}),
    P(11,'Audit log','ready',{owner:'Jordan K.',budget:10,spent:0,committed:true,estimate:10,maxDevs:2,deps:[{id:9,on:'uat',then:'start'}],summary:'Searchable record of who changed what and when, exportable for compliance reviews.',deliverables:del('prog','none','none','none','none'),history:[{date:d(30),to:'discovery'},{date:d(4),to:'ready'}]}),
    P(5,'Notifications center','discovery',{owner:'Marcus T.',budget:18,spent:0,committed:false,estimate:16,maxDevs:3,summary:'One inbox for in-app, email and mobile notifications with per-user preferences.',deliverables:del('prog','none','none','none','none'),history:[{date:d(20),to:'discovery'}]}),
    P(7,'Warehouse data export','discovery',{owner:'Priya S.',budget:12,spent:0,committed:false,estimate:12,maxDevs:2,deps:[{id:6,on:'dev',then:'start'}],summary:'Scheduled exports to common data warehouses so customers can join product data with their own.',deliverables:del('prog','none','none','none','none'),history:[{date:d(18),to:'discovery'}]}),
    P(12,'Multi-currency pricing','discovery',{owner:'Jordan K.',budget:15,spent:0,committed:false,estimate:14,maxDevs:2,deps:[{id:1,on:'released',then:'start'}],summary:'Charge customers in their local currency with tax-inclusive price display.',deliverables:del('none','none','none','none','none'),history:[{date:d(11),to:'discovery'}]}),
    P(3,'Usage analytics dashboard','intake',{owner:'Marcus T.',budget:22,spent:0,committed:false,estimate:20,maxDevs:3,deps:[{id:7,on:'released',then:'start'}],summary:'Give account admins a view of adoption by team and feature.',deliverables:del('none','none','none','none','none')}),
    P(10,'In-app help widget','intake',{owner:'Marcus T.',budget:6,spent:0,committed:false,estimate:6,maxDevs:2,deps:[{id:5,on:'released',then:'finish'}],summary:'Contextual help articles and a contact form inside the product.',deliverables:del('none','none','none','none','none')}),
    P(13,'Search relevance overhaul','intake',{owner:'Priya S.',budget:0,spent:0,committed:false,estimate:18,maxDevs:3,summary:'Rebuild the search index with typo tolerance and ranking tuned on real queries.',deliverables:del('none','none','none','none','none')}),
    P(14,'Accessibility remediation','released',{owner:'Jordan K.',budget:13,spent:14,committed:true,estimate:12,maxDevs:3,progress:100,summary:'Bring core workflows to WCAG 2.2 AA.',deliverables:del('done','done','done','done','prog'),history:[{date:d(150),to:'discovery'},{date:d(120),to:'ready'},{date:d(95),to:'dev'},{date:d(30),to:'uat'},{date:d(8),to:'released'}]}),
    P(8,'Onboarding checklist redesign','review',{owner:'Marcus T.',budget:9,spent:8,committed:true,estimate:8,maxDevs:2,progress:100,summary:'Guided first-week checklist for new accounts.',deliverables:del('done','done','done','done','prog'),history:[{date:d(160),to:'discovery'},{date:d(130),to:'ready'},{date:d(110),to:'dev'},{date:d(70),to:'uat'},{date:d(45),to:'released'},{date:d(15),to:'review'}]}),
  ];
  return {
    v:3, nextId:15,
    capacity:{devs:10, roadmapPct:75, uatWeeks:1},
    projects,
    subs:{product:['review'],dev:['ready'],exec:['dev','released'],marketing:['uat','released'],support:['uat','released'],cs:['released','review']},
    alerts:[
      {date:d(4),pid:11,stage:'ready',roles:['dev']},
      {date:d(6),pid:1,stage:'uat',roles:['marketing','support']},
      {date:d(8),pid:14,stage:'released',roles:['exec','marketing','support','cs']},
      {date:d(14),pid:4,stage:'dev',roles:['exec']},
      {date:d(15),pid:8,stage:'review',roles:['product','cs']}],
  };
}

// ---------- state ----------
const KEY='roadmap-prototype-v3';
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==3)S=seed();
S.projects.forEach(p=>p.deps=(p.deps||[]).map(normDep));
let role='product'; try{role=localStorage.getItem(KEY+'-role')||'product'}catch(e){}
if(!ROLES.find(r=>r.id===role))role='product';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const R=()=>ROLES.find(r=>r.id===role);
const canEdit=()=>R().edit;
const byId=id=>S.projects.find(p=>p.id===id);
let openId=null;

// ---------- helpers ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NONE='<span class="muted">Not set</span>';
const money=n=>n?'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}):NONE;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monday=(()=>{const t=new Date();t.setHours(0,0,0,0);const dd=(t.getDay()+6)%7;t.setDate(t.getDate()-dd);return t})();
const wkDate=w=>{const t=new Date(monday);t.setDate(t.getDate()+7*w);return t};
const fmt=t=>`${String(t.getDate()).padStart(2,'0')}\u2011${MON[t.getMonth()]}\u2011${t.getFullYear()}`;
const fmtW=w=>fmt(wkDate(w));
const fmtD=s=>fmt(new Date(s+'T00:00:00'));
const stageChip=id=>`<span class="stage" style="--sc:var(--s-${id})">${SNAME(id)}</span>`;
const wk=n=>n?`${+n} wk`:NONE;
const isOpen=p=>!DONE.has(p.stage);
const committedList=()=>S.projects.filter(p=>isOpen(p)&&p.committed);
const laterList=()=>S.projects.filter(p=>isOpen(p)&&!p.committed);
const ranked=()=>[...committedList(),...laterList()];
function budgetPill(p){
  if(!p.budget)return '<span class="pill n">No budget</span>';
  if(!p.spent)return '<span class="pill n">No spend yet</span>';
  const pct=Math.round(p.spent/p.budget*100);
  if(p.spent>p.budget)return `<span class="pill bad">Over by ${+(p.spent-p.budget).toFixed(1)} wk</span>`;
  if(pct>=90)return `<span class="pill warn">${pct}% used</span>`;
  return `<span class="pill ok">${pct}% used</span>`;
}
function spendLine(p){if(!p.spent)return '';return p.budget?`${+p.spent||0} of ${+p.budget} wk spent`:(p.spent?`${+p.spent} wk spent`:'')}
function delState(p,dl){
  const st=p.deliverables[dl.id].status;
  if(st==='done')return 'done'; if(st==='na')return 'na';
  if(dl.lateAt&&SI(p.stage)>=SI(dl.lateAt))return 'late';
  if(!dl.lateAt&&p.stage==='review')return st==='prog'?'prog':'late';
  return st==='prog'?'prog':'none';
}
function delDots(p){return `<span class="dots" title="Deliverables">${DELIVS.map(dl=>`<i class="${delState(p,dl)}" title="${dl.name}: ${DSTATUS.find(s=>s[0]===p.deliverables[dl.id].status)[1]}"></i>`).join('')}</span>`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function wouldCycle(pid,depId){ // does depId (transitively) depend on pid?
  const seen=new Set();const st=[depId];
  while(st.length){const x=st.pop();if(x===pid)return true;if(seen.has(x))continue;seen.add(x);const q=byId(x);if(q)st.push(...q.deps.map(d=>d.id))}
  return false;
}

// ---------- forecast engine ----------
// Weekly simulation: roadmap capacity (dev-weeks per week) is handed out in priority order:
// in-flight work first, then committed projects, then everything else, each by rank.
// "Start" means a project enters In Development; "finish" means it is released
// (development done plus the UAT and release weeks set on the Capacity page).
// Start-type dependencies hold a project back from taking capacity; finish-type dependencies
// hold back its release. A project never takes more developers than its max team size.
const UATW=()=>Math.max(0,+S.capacity.uatWeeks||0);
const relW=f=>f.finish+1+UATW();
function msWeek(F,qid,stage){ // week project qid reaches stage: -Infinity if already there, null if not yet known
  const q=byId(qid); if(!q||SI(q.stage)>=SI(stage))return -Infinity;
  const f=F[qid]; if(!f)return -Infinity;
  if(SI(stage)<=SI('dev'))return f.start;
  if(f.finish==null)return null;
  return stage==='uat'?f.finish+1:f.finish+1+UATW();
}
function forecast(){
  const cap=S.capacity.devs*S.capacity.roadmapPct/100;
  const rk=ranked();
  const order=[...rk.filter(p=>ACTIVE.has(p.stage)),...rk.filter(p=>!ACTIVE.has(p.stage))];
  const F={}; const used=[];
  for(const p of order){const size=+p.estimate||+p.budget||0;F[p.id]={rem:Math.max(0,size*(1-(ACTIVE.has(p.stage)?p.progress:0)/100)),start:ACTIVE.has(p.stage)?0:null,done:null,finish:null,noEst:!p.estimate,fromBudget:!p.estimate&&!!p.budget,noSize:!size&&!ACTIVE.has(p.stage)}}
  const H=260;
  for(let w=0;w<H;w++){
    let left=cap;
    for(const p of order){
      const f=F[p.id]; if(f.done!==null||f.noSize)continue;
      if(f.start===null&&!p.deps.filter(d=>d.then==='start').every(d=>{const m=msWeek(F,d.id,d.on);return m!==null&&m<=w}))continue;
      if(f.rem<=1e-9){f.start??=w;f.done=w;continue}
      if(left<=1e-9)continue;
      const a=Math.min(left,p.maxDevs||1,f.rem);
      f.start??=w; f.rem-=a; left-=a;
      if(f.rem<=1e-9)f.done=w;
    }
    for(let changed=true;changed;){changed=false;
      for(const p of order){const f=F[p.id];
        if(f.done===null||f.finish!==null)continue;
        if(p.deps.filter(d=>d.then==='finish').every(d=>{const m=msWeek(F,d.id,d.on);return m!==null&&w+1+UATW()>=m})){f.finish=w;changed=true}
      }}
    used.push(cap-left);
    if(order.every(p=>F[p.id].finish!==null||F[p.id].noSize))break;
  }
  for(const p of order){const f=F[p.id];
    if(ACTIVE.has(p.stage))f.inflight=true;
    if(f.start!==null&&!f.inflight){
      for(const d of p.deps.filter(d=>d.then==='start')){const m=msWeek(F,d.id,d.on);if(m===f.start&&m>0)f.waitingOn=d}
    }
    if(f.done!==null&&f.finish!==null&&f.finish>f.done)f.heldBy=p.deps.find(d=>d.then==='finish');
    if(f.start===null||f.finish===null)f.unsched=true;
  }
  return {F,used,cap};
}

// ---------- alerts ----------
function setStage(p,to){
  if(!canEdit()||p.stage===to)return;
  const from=p.stage;p.stage=to;
  if(to==='released'||to==='review')p.progress=100;
  if(ACTIVE.has(to)&&!p.committed){p.committed=true;const i=S.projects.indexOf(p);S.projects.splice(i,1);const last=S.projects.map(q=>isOpen(q)&&q.committed).lastIndexOf(true);S.projects.splice(last+1,0,p)}
  p.history.push({date:new Date().toISOString().slice(0,10),from,to,by:R().name});
  const roles=ROLES.filter(r=>(S.subs[r.id]||[]).includes(to)).map(r=>r.id);
  S.alerts.unshift({date:new Date().toISOString().slice(0,10),pid:p.id,stage:to,roles,by:R().name});
  save();
  toast(`${p.name} moved to ${SNAME(to)}.`+(roles.length?` Alert sent to ${roles.map(r=>ROLES.find(x=>x.id===r).name.replace(' (you)','')).join(', ')}.`:' Nobody is subscribed to this stage.'));
  render();
}

function viewHead(title,desc,actions=''){
  return `<div class="viewhead"><div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div><div>${actions}</div></div>`;
}

function plink(p){return `<a href="#project-${p.id}" data-open="${p.id}">${esc(p.name)}</a>`}

function vHome(){
  const {F}=forecast();
  const open=S.projects.filter(p=>!DONE.has(p.stage));
  const counts=STAGES.map(s=>({s,n:S.projects.filter(p=>p.stage===s.id).length}));
  const pipeline=`<div class="pipeline">${counts.map(({s,n})=>`<a href="#board" style="--sc:var(--s-${s.id});--n:${Math.max(n,1)}"><b>${n}</b><span>${s.name}</span></a>`).join('')}</div>`;
  const soon=open.filter(p=>F[p.id].finish!==null&&relW(F[p.id])<=12).sort((a,b)=>F[a.id].finish-F[b.id].finish);
  const shipList=soon.length?`<ul class="list">${soon.map(p=>`<li><div class="t">${plink(p)}<div>${stageChip(p.stage)}</div></div><div class="r"><span class="label">Forecast release</span><div class="num">${fmtW(relW(F[p.id]))}</div></div></li>`).join('')}</ul>`:'<p class="empty">Nothing forecast to ship in the next 12 weeks.</p>';
  let rolePanel='';
  if(canEdit()){
    const items=[];
    for(const p of S.projects){
      for(const dl of DELIVS){const st=delState(p,dl);if(st==='late')items.push([p,`${dl.name} is not done`,'bad'])}
      if(!DONE.has(p.stage)&&!p.estimate)items.push([p,p.budget?'No estimate yet. The forecast is using the budget instead.':'No estimate or budget, so it can\'t be forecast','warn']);
      if(!DONE.has(p.stage)&&!p.budget)items.push([p,'No budget assigned','warn']);
      if(p.budget&&p.spent>p.budget)items.push([p,`Spent ${+p.spent} wk against a ${+p.budget} wk budget`,'bad']);
      else if(p.budget&&p.estimate>p.budget&&!DONE.has(p.stage))items.push([p,`Estimate of ${+p.estimate} wk is over its ${+p.budget} wk budget`,'warn']);
      if(F[p.id]?.unsched&&!F[p.id].noSize)items.push([p,'Can\'t be scheduled. Check its dependencies.','bad']);
    }
    rolePanel=`<section class="panel"><header><h2>Needs attention</h2><span class="muted">${items.length}</span></header><div class="body">${items.length?`<ul class="list">${items.map(([p,m,c])=>`<li><div class="t">${plink(p)}<div>${m}</div></div><div class="r"><span class="pill ${c}">${c==='bad'?'Fix':'Check'}</span></div></li>`).join('')}</ul>`:'<p class="empty">Nothing needs attention.</p>'}</div></section>`;
  } else if(role==='exec'){
    const com=committedList();
    const tb=com.reduce((a,p)=>a+(+p.budget||0),0), ts=com.reduce((a,p)=>a+(+p.spent||0),0);
    const over=S.projects.filter(p=>p.budget&&(p.spent>p.budget||(isOpen(p)&&p.estimate>p.budget)));
    rolePanel=`<section class="panel"><header><h2>Committed work</h2><span class="muted">In developer weeks</span></header><div class="body"><div class="kpis"><div><span class="label">Projects</span><b>${com.length}</b></div><div><span class="label">Budget</span><b>${tb} wk</b></div><div><span class="label">Spent</span><b>${ts} wk</b></div><div><span class="label">Remaining</span><b style="color:var(${tb-ts<0?'--bad':'--fg'})">${tb-ts<0?'−':''}${Math.abs(tb-ts)} wk</b></div></div>
      <span class="label">Over budget or at risk</span>${over.length?`<ul class="list">${over.map(p=>`<li><div class="t">${plink(p)}<div>${p.spent>p.budget?spendLine(p):`Estimate ${+p.estimate} wk against a ${+p.budget} wk budget`}</div></div><div class="r">${p.spent>p.budget?budgetPill(p):'<span class="pill warn">At risk</span>'}</div></li>`).join('')}</ul>`:'<p class="empty">Every project is within budget.</p>'}</div></section>`;
  } else {
    const key=role==='marketing'?'mkt':'sys';
    const dl=DELIVS.find(x=>x.id===key);
    const list=open.filter(p=>SI(p.stage)>=SI('dev')||(F[p.id].finish!==null&&F[p.id].finish<=16)).sort((a,b)=>(F[a.id].finish??999)-(F[b.id].finish??999));
    const title=role==='marketing'?'Upcoming launches':'Get ready for';
    rolePanel=`<section class="panel"><header><h2>${title}</h2><span class="label">${dl.name}</span></header><div class="body">${list.length?`<ul class="list">${list.map(p=>{const x=p.deliverables[key];const st=delState(p,dl);return `<li><div class="t">${plink(p)}<div>Ships around ${F[p.id].finish!==null?fmtW(relW(F[p.id])):'TBD'}${x.link?` · <a href="${esc(x.link)}" target="_blank" rel="noopener">Open doc</a>`:''}</div></div><div class="r"><span class="pill ${st==='done'?'ok':st==='late'?'bad':st==='prog'?'warn':'n'}">${DSTATUS.find(s=>s[0]===x.status)[1]}</span></div></li>`}).join('')}</ul>`:'<p class="empty">Nothing coming up yet.</p>'}</div></section>`;
  }
  const mine=S.alerts.filter(a=>a.roles.includes(role)).slice(0,6);
  const alertsPanel=`<section class="panel"><header><h2>Your alerts</h2><a href="#alerts">Manage</a></header><div class="body">${mine.length?`<ul class="list feed">${mine.map(alertLi).join('')}</ul>`:'<p class="empty">No alerts yet. Subscribe to stages on the Alerts page.</p>'}</div></section>`;
  return viewHead('Roadmap at a glance',`${open.length} open projects. Forecasts assume ${(S.capacity.devs*S.capacity.roadmapPct/100).toFixed(1)} dev-weeks of roadmap capacity per week.`)+roleNote()+pipeline+
    `<div class="grid2">${rolePanel}<section class="panel"><header><h2>Next to ship</h2><a href="#timeline">Timeline</a></header><div class="body">${shipList}</div></section>${alertsPanel}</div>`;
}
function alertLi(a){const p=byId(a.pid);if(!p)return '';return `<li><div class="t">${plink(p)}<div>Entered ${stageChip(a.stage)}${a.by?` · moved by ${esc(a.by)}`:''}</div></div><div class="r when">${fmtD(a.date)}</div></li>`}

function vBacklog(){
  const {F}=forecast(); const ed=canEdit();
  const com=committedList(), later=laterList(), shipped=S.projects.filter(p=>DONE.has(p.stage));
  const mv=(p,dir,dis,label)=>`<button data-move="${p.id}" data-dir="${dir}" aria-label="${label}" title="${label}" ${dis?'disabled':''}><svg class="ico" viewBox="0 0 24 24"><path d="${dir<0?'m18 15-6-6-6 6':'m6 9 6 6 6-6'}"/></svg></button>`;
  const row=(p,i,sec,n,offset)=>{const f=F[p.id]||{};const open=sec!=='shipped';
    const start=!open?'<span class="muted">Done</span>':f.inflight?'<span class="muted">In flight</span>':f.noSize?'<span class="pill warn">Needs an estimate</span>':f.unsched?'<span class="pill bad">Blocked</span>':fmtW(f.start);
    const fin=!open?fmtD(([...p.history].reverse().find(h=>h.to==='released')||{}).date||new Date().toISOString().slice(0,10)):f.finish!=null?fmtW(relW(f)):NONE;
    const up=sec==='committed'?(i===0?[true,'Move up']:[false,'Move up']):(i===0?[false,'Move into committed']:[false,'Move up']);
    const down=sec==='committed'?(i===n-1?[ACTIVE.has(p.stage),'Move out of committed']:[false,'Move down']):[i===n-1,'Move down'];
    if(!bfMatch(p,f,sec))return '';
    return `<tr><td class="rank">${open&&ed&&!bfActive()?`<span class="moves">${mv(p,-1,up[0],up[1])}${mv(p,1,down[0],down[1])}</span>`:''}${open?offset+i+1:''}</td>
    <td><a class="name" href="#project-${p.id}" data-open="${p.id}">${esc(p.name)}</a><div class="sub">${esc(p.owner)}${f.waitingOn?` · waits for ${esc(byId(f.waitingOn.id).name)} to ${f.waitingOn.on==='dev'?'start':f.waitingOn.on==='released'?'ship':'reach '+SNAME(f.waitingOn.on)}`:''}</div></td>
    <td>${stageChip(p.stage)}</td>
    <td class="right num">${wk(p.budget)}</td>
    <td class="right num">${wk(p.estimate)}</td>
    <td>${budgetPill(p)}<div class="sub" style="white-space:nowrap">${spendLine(p)}</div></td>
    <td><div class="deps">${p.deps.map(d=>`<span class="chip" title="${esc(depLong(d,p.name))}">${esc(byId(d.id)?.name||'?')} ${depTag(d)}</span>`).join('')||'<span class="muted">None</span>'}</div></td>
    <td class="num">${start}</td><td class="num">${fin}</td><td>${delDots(p)}</td></tr>`};
  const head=(t,d,n)=>`<tr class="section"><td colspan="10"><b>${t}</b> <span class="muted">· ${n} ${n===1?'project':'projects'}${d?' · '+d:''}</span></td></tr>`;
  const sect=(key,t,d,list,offset,emptyMsg)=>{if(BF.sec!=='all'&&BF.sec!==key)return '';const rows=list.map((p,i)=>row(p,i,key,list.length,offset));const shown=rows.filter(Boolean).length;
    if(bfActive()&&!shown)return '';return head(t,d,bfActive()?shown:list.length)+(rows.join('')||`<tr><td colspan="10" class="muted">${emptyMsg}</td></tr>`)};
  const total=S.projects.length;
  const shownCount=[...com.map(p=>bfMatch(p,F[p.id]||{},'committed')),...later.map(p=>bfMatch(p,F[p.id]||{},'later')),...shipped.map(p=>bfMatch(p,{},'shipped'))].filter(Boolean).length;
  const sel=(id,key,label,opts,anyLabel)=>`<div class="f"><label for="${id}">${label}</label><select id="${id}" data-bf="${key}"><option value="">${anyLabel}</option>${opts.map(([v,l])=>`<option value="${v}" ${BF[key]===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
  const filterBar=`<div class="filters" role="search" aria-label="Filter the backlog">
    <div class="f"><span class="label">Show</span><div class="seg">${[['all','All'],['committed','Committed'],['later','Everything else'],['shipped','Shipped']].map(([v,l])=>`<button data-bfsec="${v}" aria-pressed="${BF.sec===v}">${l}</button>`).join('')}</div></div>
    ${sel('bf-stage','stage','Stage',STAGES.map(st=>[st.id,st.name]),'Any stage')}
    ${sel('bf-start','start','Forecast start',START_OPTS,'Any time')}
    ${sel('bf-rel','rel','Forecast release',REL_OPTS,'Any time')}
    ${sel('bf-health','health','Budget health',HEALTH_OPTS,'Any')}
    <div class="count">Showing ${shownCount} of ${total}${bfActive()?' <button class="btn sm ghost" data-act="clearbf">Clear filters</button>':''}</div>
  </div>${bfActive()&&ed?'<p class="muted" style="font-size:12px;margin:-8px 0 12px">Re-ranking is off while filters are on. Clear filters to use the arrows.</p>':''}`;
  return viewHead('Backlog',ed?'Committed work is forecast first, then everything else in rank order. Use the arrows to re-rank or to move a project between sections.':'Committed work is forecast first, then everything else in rank order. Dates come from development capacity and dependencies.',ed?'<button class="btn primary" data-act="add"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add project</button>':'')+
  filterBar+`<div class="tablewrap"><table><thead><tr><th>#</th><th>Project</th><th>Stage</th><th class="right">Budget</th><th class="right">Estimate</th><th>Budget health</th><th>Depends on</th><th>Forecast start</th><th>Forecast release</th><th>Deliverables</th></tr></thead><tbody>
  ${sect('committed','Committed','being built or planned for the near term',com,0,'Nothing committed yet. Move a project up from everything else.')}
  ${sect('later','Everything else','ideas and future work',later,com.length,'Nothing here yet. Add a project to start.')}
  ${sect('shipped','Shipped','',shipped,0,'Nothing shipped yet.')}
  ${shownCount?'':'<tr><td colspan="10"><p class="empty">No projects match these filters. <button class="btn sm ghost" data-act="clearbf">Clear filters</button></p></td></tr>'}</tbody></table></div>
  <div class="legend"><span>Budget and estimate are in developer weeks. Budget health compares actual spend to budget.</span><span>Deliverables, in order: ${DELIVS.map(x=>x.name).join(', ')}.</span><span><span class="dots"><i class="done"></i></span> Done</span><span><span class="dots"><i class="prog"></i></span> In progress</span><span><span class="dots"><i class="late"></i></span> Overdue for this stage</span></div>`;
}

function vBoard(){

  `<div class="board">${STAGES.map(s=>{const ps=S.projects.filter(p=>p.stage===s.id);return `<div class="col" data-col="${s.id}" style="--sc:var(--s-${s.id})"><h3>${s.name}<span>${ps.length}</span></h3>${ps.map(p=>{const f=F[p.id];return `<div class="card" data-open="${p.id}" ${ed?`draggable="true" data-drag="${p.id}"`:''} tabindex="0"><div class="t">${esc(p.name)}</div><div class="m"><span>${esc(p.owner)}</span>${delDots(p)}</div><div class="m"><span class="num">${p.estimate?+p.estimate+' wk est':'No estimate'} · ${p.budget?+p.budget+' wk budget':'no budget'}</span><span class="num">${f&&f.finish!=null?'Ships '+fmtW(relW(f)):''}</span></div></div>`}).join('')}</div>`}).join('')}</div>`;

function vTimeline(){
  const {F}=forecast();
  const open=ranked();
  const max=Math.max(0,...open.map(p=>F[p.id].finish??0));
  const N=Math.min(156,Math.max(26,max+4)); const W=24; const RH=38; const HH=44;
  let months='',grid='';
  for(let w=0;w<N;w++){const t=wkDate(w);const prev=wkDate(w-1);
    if(w===0||t.getMonth()!==prev.getMonth())months+=`<div class="tl-month" style="left:${w*W}px">${t.toLocaleDateString('en-US',{month:'short'})}${t.getMonth()===0||w===0?' '+t.getFullYear():''}</div>`;
    if(w%4===0)months+=`<div class="tl-wk" style="left:${w*W+3}px">${t.getDate()}</div>`;
    if(t.getMonth()!==prev.getMonth())grid+=`<div class="tl-grid" style="left:${w*W}px"></div>`;
  }
  const idx={};open.forEach((p,i)=>idx[p.id]=i);
  let links='';
  open.forEach((p,i)=>{const f=F[p.id];if(f.start==null)return;
    p.deps.forEach(d=>{if(idx[d.id]==null)return;const m=msWeek(F,d.id,d.on);if(m===null||m===-Infinity||f.finish==null)return;
      const x1=m*W, y1=HH+idx[d.id]*RH+RH/2, x2=(d.then==='start'?f.start:relW(f))*W, y2=HH+i*RH+RH/2, mx=d.then==='start'?Math.max(x1+6,x2-6):x2+8;
      links+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="${x1}" cy="${y1}" r="2" fill="var(--muted)"/><circle cx="${x2}" cy="${y2}" r="3" fill="var(--accent)"/>`;
    })});
  const rows=open.map((p,i)=>{const f=F[p.id];
    const bar=f.start==null?`<div class="bar-after" style="left:8px">Can't be scheduled: ${f.noSize?'needs an estimate or a budget':'check its dependencies'}</div>`:
      `<div class="bar ${f.inflight?'inprog':''}" data-open="${p.id}" style="--sc:var(--s-${p.stage});left:${f.start*W}px;width:${Math.max(1,f.finish-f.start+1)*W-2}px" title="${esc(p.name)}: development ${fmtW(f.start)} to ${fmtW(f.finish+1)}">${(f.finish-f.start+1)*W>110?esc(SNAME(p.stage)):''}</div>${relW(f)>f.finish+1?`<div class="bar uat" style="--sc:var(--s-uat);left:${(f.finish+1)*W}px;width:${(relW(f)-f.finish-1)*W-2}px" title="UAT and release"></div>`:''}<div class="bar-after" style="left:${relW(f)*W+6}px">${fmtW(relW(f))}</div>`;
    return `<div class="tl-row"><div class="tl-name"><span class="rk">${i+1}</span>${plink(p)}</div><div class="tl-track" style="width:${N*W+120}px">${grid}${bar}</div></div>`}).join('');
  return viewHead('Timeline','Solid bars are development, pale bars are UAT and release, and striped bars are already in progress. Dotted lines run from the point a dependency is met to where the next project can start or finish.')+
   `<div class="tl"><div class="tl-inner"><div class="tl-row head"><div class="tl-name"><span class="label">Project</span></div><div class="tl-track" style="width:${N*W+120}px">${months}</div></div>${rows}
   <svg class="links" style="left:var(--namew);width:${N*W}px;height:${HH+open.length*RH}px">${links}</svg>
   <div class="tl-today" style="left:var(--namew);top:0;height:${HH+open.length*RH}px" title="This week"></div></div></div>
   <div class="legend">${STAGES.filter(s=>!DONE.has(s.id)).map(s=>`<span>${stageChip(s.id)}</span>`).join('')}<span><span style="display:inline-block;width:2px;height:12px;background:var(--bad);vertical-align:middle"></span> This week</span></div>`;
}

function vCapacity(){
  const {F,used,cap}=forecast(); const ed=canEdit(); const c=S.capacity;
  const N=Math.min(used.length,78);
  const bars=used.slice(0,N).map((u,w)=>`<div style="height:${cap?Math.max(1,u/cap*100):0}%" class="${u<cap-0.01?'free':''}" title="${fmtW(w)}: ${u.toFixed(1)} of ${cap.toFixed(1)} dev-weeks used"></div>`).join('');
  const firstFree=used.findIndex(u=>u<cap-0.01);
  const dis=ed?'':'disabled';
  return viewHead('Development capacity',ed?'Change the team size or the roadmap share and every forecast updates right away.':'Read-only. Product and the head of development set these numbers.')+
  `<div class="capgrid"><section class="panel"><header><h2>Inputs</h2></header><div class="body">
    <div class="field"><label for="c-devs">Developers</label><input id="c-devs" type="number" min="0" step="1" value="${c.devs}" data-cap="devs" ${dis}><span class="hint">Full-time engineers on the team.</span></div>
    <div class="field"><label for="c-pct">Share on roadmap work (%)</label><input id="c-pct" type="number" min="0" max="100" step="5" value="${c.roadmapPct}" data-cap="roadmapPct" ${dis}><span class="hint">The rest goes to maintenance, bugs and support.</span></div>
    <div class="field"><label for="c-uat">UAT and release time (weeks)</label><input id="c-uat" type="number" min="0" step="1" value="${c.uatWeeks??1}" data-cap="uatWeeks" ${dis}><span class="hint">Time between development finishing and release. Used for release dates and stage-gate dependencies.</span></div>
    <span class="label">Roadmap capacity</span><div class="big">${cap.toFixed(1)} <span class="muted" style="font-size:1rem">dev-weeks / week</span></div>
  </div></section>
  <section class="panel"><header><h2>Capacity used, week by week</h2><span class="muted">${N} weeks</span></header><div class="body">
    <div class="util" role="img" aria-label="Weekly capacity use">${bars}</div>
    <div class="utilx"><span>${fmtW(0)}</span><span>${fmtW(Math.floor(N/2))}</span><span>${fmtW(N-1)}</span></div>
    <p class="muted" style="margin-top:12px">${firstFree<0?'The team is fully booked for the whole forecast.':`The team is fully booked until <b>${fmtW(firstFree)}</b>. After that, capacity opens up for the next project in the backlog.`} Pale bars mean spare capacity, usually because the next projects are waiting on dependencies or have hit their team size limit.</p>
    <span class="label">How the forecast works</span>
    <p class="muted" style="margin:4px 0 0">Each week, roadmap capacity goes first to projects already in development or UAT, then to the backlog in rank order. Dependencies can hold back a project's start or its release: finish to start, start to start, finish to finish, start to finish, or a stage gate such as "can't start until project A reaches UAT". A project never takes more developers than its max team size.</p>
  </div></section></div>`;
}

  const dis=ed?'':'disabled';

  if(depDraft.pid!==p.id)depDraft={pid:p.id,type:'FS',id:'',then:'start',on:'uat'};

  const fc=DONE.has(p.stage)?'Shipped':f.noSize?'Add an estimate or a budget to forecast':f.unsched?'Can\'t be scheduled':f.heldBy?`${fmtW(f.start)} to ${fmtW(relW(f))} (release held by a dependency)`:f.inflight?`In flight · ships ${fmtW(relW(f))}`:`${fmtW(f.start)} to ${fmtW(relW(f))}`;
  const fact=(label,val,input)=>`<div><span class="label">${label}</span><div class="v">${ed&&input?input:val}</div></div>`;
  dr.innerHTML=`<div class="dh"><div style="min-width:0;flex:1">
      ${ed?`<input type="text" id="p-name" data-f="name" value="${esc(p.name)}" class="p-name" aria-label="Project name">`:`<h2>${esc(p.name)}</h2>`}
      <div class="meta">${stageChip(p.stage)}<span>${DONE.has(p.stage)?'Shipped':'Rank '+(ranked().indexOf(p)+1)+(p.committed?' · Committed':' · Everything else')}</span><span>Owner: ${esc(p.owner)}</span></div></div>
      <button class="close" data-act="close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="db">
      <section><span class="label">Stage</span><div class="stepper" style="margin-top:6px">${STAGES.map(s=>`<button data-stage-to="${s.id}" class="${s.id===p.stage?'cur':SI(s.id)<SI(p.stage)?'past':''}" style="--sc:var(--s-${s.id})" ${ed?'':'disabled'}>${s.name}</button>`).join('')}</div>${ed?'<p class="muted" style="font-size:.78rem;margin:6px 0 0">Click a stage to move the project. Teams subscribed to that stage get an alert.</p>':''}</section>
      <section class="panel"><div class="body facts">
        ${fact('Forecast',`<span class="num">${fc}</span>${f.fromBudget&&!DONE.has(p.stage)?'<div class="muted" style="font-weight:400;font-size:12px">Based on the budget until there is an estimate</div>':''}`)}
        ${fact('Owner',esc(p.owner),`<input type="text" id="p-owner" data-f="owner" value="${esc(p.owner)}">`)}
        ${fact('Backlog section',p.committed?'Committed':'Everything else',DONE.has(p.stage)?null:`<select id="p-com" data-f="committed"><option value="1" ${p.committed?'selected':''}>Committed</option><option value="0" ${p.committed?'':'selected'}>Everything else</option></select>`)}
        ${fact('Budget (dev-weeks)',`<span class="num">${wk(p.budget)}</span>`,`<input type="number" id="p-budget" data-f="budget" min="0" step="1" value="${p.budget}">`)}
        ${fact('Estimate (dev-weeks)',(p.estimate?`<span class="num">${p.estimate}</span>`:NONE),`<input type="number" id="p-est" data-f="estimate" min="0" step="1" value="${p.estimate}">`)}
        ${fact('Spent to date (dev-weeks)',`<span class="num">${wk(p.spent)}</span>`,`<input type="number" id="p-spent" data-f="spent" min="0" step="0.5" value="${p.spent||0}">`)}
        ${fact('Budget health',`${budgetPill(p)}<div class="muted" style="font-weight:400;font-size:12px">${spendLine(p)}</div>`)}
        ${fact('Max team size',`<span class="num">${p.maxDevs} devs</span>`,`<input type="number" id="p-max" data-f="maxDevs" min="1" step="1" value="${p.maxDevs}">`)}
        ${ACTIVE.has(p.stage)?fact('Dev progress',`<span class="num">${p.progress}%</span>`,`<input type="number" id="p-prog" data-f="progress" min="0" max="100" step="5" value="${p.progress}">`):''}
      </div></section>
      <section><span class="label">Summary</span>${ed?`<textarea id="p-sum" data-f="summary" rows="3" style="margin-top:6px">${esc(p.summary)}</textarea>`:`<p style="margin:4px 0 0">${esc(p.summary)||'<span class="muted">No summary yet.</span>'}</p>`}</section>
      <section class="panel"><header><h3>Dependencies</h3><span class="muted" style="font-size:12px">Start means entering In Development. Finish means released.</span></header><div class="body" style="display:grid;gap:16px">
        <div><span class="label">This project waits on</span>${p.deps.length?`<ul class="deprows">${p.deps.map((d,i)=>{const q=byId(d.id);return `<li><span>Can't <b>${d.then}</b> until ${q?`<a href="#project-${q.id}" data-open="${q.id}">${esc(q.name)}</a>`:'?'} ${onText(d.on)} ${depTag(d)}${q?' '+stageChip(q.stage):''}</span>${ed?`<button class="btn sm ghost" data-undep="${i}" aria-label="Remove dependency">Remove</button>`:''}</li>`}).join('')}</ul>`:'<p class="empty">Nothing. This project can start whenever capacity allows.</p>'}
        ${ed?`<div class="depform"><span class="label">Add a dependency</span>
          <div class="row"><label for="dep-type" class="muted">Type</label><select id="dep-type" data-dep="type">${DEP_TYPES.map(t=>`<option value="${t.id}" ${t.id===depDraft.type?'selected':''}>${t.name}${t.id==='gate'?'':' ('+t.id+')'}</option>`).join('')}</select>
          <label for="dep-proj" class="muted">Project</label><select id="dep-proj" data-dep="id"><option value="">Choose a project…</option>${others.map(q=>`<option value="${q.id}" ${String(q.id)===String(depDraft.id)?'selected':''}>${esc(q.name)}</option>`).join('')}</select></div>
          ${depDraft.type==='gate'?`<div class="row">This project can't <select id="dep-then" data-dep="then" aria-label="Start or finish"><option value="start" ${depDraft.then==='start'?'selected':''}>start</option><option value="finish" ${depDraft.then==='finish'?'selected':''}>finish</option></select> until it reaches <select id="dep-on" data-dep="on" aria-label="Stage">${GATE_STAGES.map(st=>`<option value="${st}" ${st===depDraft.on?'selected':''}>${SNAME(st)}</option>`).join('')}</select></div>`:''}
          <div class="row"><button class="btn primary sm" data-act="adddep" ${!depDraft.id||dupe?'disabled':''}>Add dependency</button><span class="preview">${depDraft.id?(dupe?'This dependency already exists.':depLong(draft)+'.'):'Pick a project to see how the rule reads.'}</span></div>
        </div>`:''}</div>
        <div><span class="label">Projects waiting on this one</span>${unblocks.length?`<ul class="deprows">${unblocks.map(([q,d])=>`<li><span><a href="#project-${q.id}" data-open="${q.id}">${esc(q.name)}</a> can't ${d.then} until this project ${onText(d.on)} ${depTag(d)}</span></li>`).join('')}</ul>`:'<p class="empty">None.</p>'}</div>
      </div></section>
      <section class="panel"><header><h3>Deliverables by team</h3></header><div class="body" style="overflow-x:auto"><table class="dtable"><thead><tr><th>Deliverable</th><th>Team</th><th>Needed</th><th>Status</th><th>Link</th></tr></thead><tbody>
        ${DELIVS.map(dl=>{const x=p.deliverables[dl.id];const st=delState(p,dl);return `<tr><td><b>${dl.name}</b>${st==='late'?' <span class="pill bad">Overdue</span>':''}</td><td class="muted">${dl.team}</td><td class="muted" style="font-size:.8rem">${dl.when}</td>
        <td>${ed?`<select id="d-${dl.id}-s" data-dl="${dl.id}" data-k="status">${DSTATUS.map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select>`:`<span class="pill ${st==='done'?'ok':st==='late'?'bad':st==='prog'?'warn':'n'}">${DSTATUS.find(s=>s[0]===x.status)[1]}</span>`}</td>
        <td>${ed?`<input type="url" id="d-${dl.id}-l" data-dl="${dl.id}" data-k="link" placeholder="https://" value="${esc(x.link)}">`:x.link?`<a class="linktext" href="${esc(x.link)}" target="_blank" rel="noopener" title="${esc(x.link)}">${esc(x.link.replace(/^https?:\/\//,''))}</a>`:'<span class="muted">None</span>'}</td></tr>`}).join('')}
      </tbody></table></div></section>
      <section class="panel"><header><h3>Stage history</h3></header><div class="body"><ul class="list hist">${[...p.history].reverse().map(h=>`<li><span>Entered ${stageChip(h.to)}${h.by?` <span class="muted">by ${esc(h.by)}</span>`:''}</span><span class="when num muted">${fmtD(h.date)}</span></li>`).join('')||'<li class="muted">Still in Intake.</li>'}</ul></div></section>
      ${ed?`<div><button class="btn danger" data-act="delete">${confirmDel===p.id?'Delete this project? Click again to confirm':'Delete project'}</button></div>`:''}
    </div>`;
  dr.hidden=false;sc.hidden=false;
}
let confirmDel=null;

// ---------- render & routing ----------
let view='home';
function route(){
  const h=location.hash.slice(1);
  const m=h.match(/^project-(\d+)$/);
  if(m){openId=+m[1];if(!byId(openId))openId=null}else{openId=null;if(VIEWS.some(v=>v[0]===h))view=h}
  render();
}
function render(){
  document.getElementById('nav').innerHTML=VIEWS.map(([id,n])=>`<a href="#${id}" ${id===view?'aria-current="page"':''}>${n}</a>`).join('');
  const sel=document.getElementById('role');
  sel.innerHTML=ROLES.map(r=>`<option value="${r.id}" ${r.id===role?'selected':''}>${r.name}${r.edit?'':' (view only)'}</option>`).join('');
  const fn={home:vHome,backlog:vBacklog,board:vBoard,timeline:vTimeline,capacity:vCapacity,alerts:vAlerts}[view];
  document.getElementById('main').innerHTML=fn();
  drawer();
}
function closeDrawer(){openId=null;confirmDel=null;history.replaceState(null,'','#'+view);drawer()}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target;
  const op=t.closest('[data-open]');
  if(op&&!t.closest('button')){e.preventDefault();openId=+op.dataset.open;confirmDel=null;history.replaceState(null,'','#project-'+openId);drawer();document.getElementById('drawer').scrollTop=0;return}
  const mv=t.closest('[data-move]');
  if(mv&&canEdit()){const id=+mv.dataset.move,dir=+mv.dataset.dir;const L=ranked();const i=L.findIndex(p=>p.id===id);const p=L[i];const j=i+dir;
    const q=L[j];
    if(q&&q.committed===p.committed){[L[i],L[j]]=[L[j],L[i]]}
    else if(p.committed&&dir>0){if(ACTIVE.has(p.stage))return;p.committed=false;toast(`${p.name} moved to everything else.`)}
    else if(!p.committed&&dir<0){p.committed=true;toast(`${p.name} is now committed.`)}
    else return;
    S.projects=[...L,...S.projects.filter(x=>DONE.has(x.stage))];save();render();return}
  const st=t.closest('[data-stage-to]'); if(st){setStage(byId(openId),st.dataset.stageTo);return}
  const ud=t.closest('[data-undep]'); if(ud&&canEdit()){const p=byId(openId);p.deps.splice(+ud.dataset.undep,1);save();render();toast('Dependency removed.');return}
  const act=t.closest('[data-act]')?.dataset.act;
  if(act==='close'||t.id==='scrim'){closeDrawer();return}
  const bs=t.closest('[data-bfsec]'); if(bs){BF.sec=bs.dataset.bfsec;saveBF();render();return}
  if(act==='clearbf'){BF={...BF0};saveBF();render();return}
  if(act==='adddep'&&canEdit()){const p=byId(openId);const dt=DEP_TYPES.find(x=>x.id===depDraft.type);const d={id:+depDraft.id,on:dt.on||depDraft.on,then:dt.then||depDraft.then};if(!d.id||wouldCycle(p.id,d.id))return;if(!p.deps.some(x=>x.id===d.id&&x.on===d.on&&x.then===d.then))p.deps.push(d);depDraft.id='';save();render();toast('Dependency added. Forecasts updated.');return}
  if(act==='add'&&canEdit()){const id=S.nextId++;S.projects.push({id,name:'New project',stage:'intake',progress:0,owner:'Unassigned',budget:0,estimate:0,maxDevs:3,deps:[],summary:'',history:[],deliverables:del()});save();openId=id;history.replaceState(null,'','#project-'+id);render();setTimeout(()=>document.getElementById('p-name')?.select(),0);return}
  if(act==='delete'&&canEdit()){if(confirmDel!==openId){confirmDel=openId;drawer();return}const id=openId;S.projects=S.projects.filter(p=>p.id!==id);S.projects.forEach(p=>p.deps=p.deps.filter(x=>x.id!==id));S.alerts=S.alerts.filter(a=>a.pid!==id);save();closeDrawer();render();toast('Project deleted.');return}
  if(act==='reset'){S=seed();save();openId=null;render();toast('Sample data restored.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeDrawer();if(e.key==='Enter'&&e.target.matches('.card[data-open]'))e.target.click()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='role'){role=t.value;try{localStorage.setItem(KEY+'-role',role)}catch(_){};const h=R().home;if(!openId){view=h;history.replaceState(null,'','#'+view)}render();toast(`Now viewing as ${R().name}.`);return}
  if(t.dataset.bf){BF[t.dataset.bf]=t.value;saveBF();render();document.getElementById(t.id)?.focus();return}
  if(!canEdit()&&!t.dataset.sub)return;
  const p=openId&&byId(openId);
  if(t.dataset.f==='committed'&&p){p.committed=t.value==='1';S.projects.splice(S.projects.indexOf(p),1);p.committed?S.projects.push(p):S.projects.unshift(p);S.projects=[...committedList(),...laterList(),...S.projects.filter(x=>DONE.has(x.stage))];save();render();return}
  if(t.dataset.f&&p){const k=t.dataset.f;let v=t.value;if(t.type==='number'){v=Math.max(0,+v||0);if(k==='progress')v=Math.min(100,v);if(k==='maxDevs')v=Math.max(1,v);if(k==='spent'||k==='budget'||k==='estimate')v=Math.round(v*2)/2}p[k]=v;save();render();return}
  if(t.dataset.dep&&p){depDraft[t.dataset.dep]=t.value;drawer();document.getElementById(t.id)?.focus();return}
  if(t.dataset.dl&&p){p.deliverables[t.dataset.dl][t.dataset.k]=t.value;save();render();return}
  if(t.dataset.cap){let v=Math.max(0,+t.value||0);if(t.dataset.cap==='roadmapPct')v=Math.min(100,v);S.capacity[t.dataset.cap]=v;save();render();setTimeout(()=>document.getElementById(t.id)?.focus(),0);return}
  if(t.dataset.sub){const r=t.dataset.sub;if(!(canEdit()||r===role))return;const set=new Set(S.subs[r]||[]);t.checked?set.add(t.dataset.stage):set.delete(t.dataset.stage);S.subs[r]=[...set];save();toast('Alert preferences saved.');return}
});
// drag and drop on the stage board
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-col]');if(col&&canEdit()){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-col]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('[data-col]');if(!col)return;e.preventDefault();col.classList.remove('over');const p=byId(+e.dataTransfer.getData('text/plain'));if(p)setStage(p,col.dataset.col)});
window.addEventListener('hashchange',route);
if(!location.hash)view=R().home;
route();
</script>
