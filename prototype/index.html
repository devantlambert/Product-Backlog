<title>Roadmap by Dev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Dev brand tokens v1.0.0 (Roadmap). Layout: sticky app header over one working canvas, max 1200 px; project detail opens as a floating right-hand panel. */
:root{
  /* primitives */
  --dev-paper:#F6F3EC; --dev-white:#FFFFFF; --dev-paper-line:#DED8CB; --dev-ink:#1F2A24; --dev-moss:#5E665F;
  --dev-forest:#2D6A4F; --dev-slate:#3A5BA0; --dev-plum:#7B4B94; --dev-clay:#A3552A; --dev-teal:#1F7A75; --dev-gold:#9C7A12;
  --dev-leaf:#2F7D32; --dev-amber:#8A5C00; --dev-brick:#B3261E;
  /* semantic */
  --bg:var(--dev-paper); --surface:var(--dev-white); --sunk:#EFEBE1; --line:var(--dev-paper-line); --fg:var(--dev-ink); --muted:var(--dev-moss);
  --brand:var(--dev-forest); --accent:var(--dev-slate); --accent-ink:#FFFFFF; --accent-soft:#E6EAF3;
  --ok:var(--dev-leaf); --ok-soft:#E3EFE1; --warn:var(--dev-amber); --warn-soft:#F4EAD3; --bad:var(--dev-brick); --bad-soft:#F6E1DD;
  --s-intake:var(--dev-moss); --s-discovery:var(--dev-plum); --s-ready:var(--dev-slate); --s-dev:var(--dev-gold); --s-uat:var(--dev-teal); --s-released:var(--dev-leaf); --s-review:var(--dev-clay);
  --chip-bg:12%; --bar-ink:#FFFFFF;
  --float-shadow:0 8px 28px rgba(31,42,36,.16);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-sm:4px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A17; --surface:#1C231F; --sunk:#18201C; --line:#323C36; --fg:#ECE8DF; --muted:#A3ABA4;
  --brand:#6FBF94; --accent:#8FA8DD; --accent-ink:#141A17; --accent-soft:#25304A;
  --ok:#7CC97F; --ok-soft:#1F3321; --warn:#E0B04A; --warn-soft:#3A2F15; --bad:#F08A7E; --bad-soft:#3E211D;
  --s-intake:#A3ABA4; --s-discovery:#C39BD8; --s-ready:#8FA8DD; --s-dev:#D9B64A; --s-uat:#6CC3BC; --s-released:#7CC97F; --s-review:#E39368;
  --chip-bg:18%; --bar-ink:#141A17; --float-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1C231F; --sunk:#18201C; --line:#323C36; --fg:#ECE8DF; --muted:#A3ABA4;
  --brand:#6FBF94; --accent:#8FA8DD; --accent-ink:#141A17; --accent-soft:#25304A;
  --ok:#7CC97F; --ok-soft:#1F3321; --warn:#E0B04A; --warn-soft:#3A2F15; --bad:#F08A7E; --bad-soft:#3E211D;
  --s-intake:#A3ABA4; --s-discovery:#C39BD8; --s-ready:#8FA8DD; --s-dev:#D9B64A; --s-uat:#6CC3BC; --s-released:#7CC97F; --s-review:#E39368;
  --chip-bg:18%; --bar-ink:#141A17; --float-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:24px;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:40px} h2{font-size:20px;line-height:28px} h3{font-size:16px;line-height:24px}
a{color:var(--accent)}
b,strong{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.dev-date{white-space:nowrap;font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1232px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.btn,nav.views a,.card,select,input{transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}}

/* app header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px;line-height:28px}
.brand svg{flex:none;display:block}
nav.views{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
nav.views a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
nav.views a:hover{color:var(--fg)}
nav.views a[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.rolebox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=url],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-height:40px;min-width:0;font-size:14px}
select:hover,input:hover{border-color:var(--muted)}
textarea{width:100%;resize:vertical;padding:8px 12px;line-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 16px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:0 8px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
@media (pointer:coarse){.btn,select,input[type=text],input[type=number],input[type=url],nav.views a{min-height:44px}}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{padding-block:32px 64px}
.viewhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.rolenote{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-left:0;background:var(--surface);border-radius:var(--r);padding:12px 16px;margin-bottom:24px;font-size:14px;line-height:20px}
.rolenote b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 0}
.panel .body{padding:12px 16px 16px}
.label{font-size:12px;line-height:16px;color:var(--muted);font-weight:600}

/* stage tag (radius 4, always with its word) */
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;padding:2px 8px 2px 6px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--sc) var(--chip-bg),transparent);color:var(--fg)}
.stage::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--sunk);color:var(--muted)}

/* home */
.pipeline{display:flex;flex-wrap:wrap;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.pipeline a{flex:var(--n) 1 0;min-width:96px;padding:12px;text-decoration:none;color:var(--fg);border-top:4px solid var(--sc);border-right:1px solid var(--line)}
.pipeline a:last-child{border-right:0}
.pipeline a:hover{background:var(--sunk)}
.pipeline b{display:block;font-size:24px;line-height:32px;font-variant-numeric:tabular-nums}
.pipeline span{font-size:12px;line-height:16px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px;margin-top:24px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px}
.list li:first-child{border-top:0}
.list .t{min-width:0}
.list .t a{font-weight:600;text-decoration:none;color:var(--fg)}
.list .t a:hover{color:var(--accent);text-decoration:underline}
.list .t div{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.list .r{text-align:right;flex:none;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:16px}
.kpis div b{display:block;font-size:20px;line-height:28px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:8px 0;margin:0}

/* table (one step tighter) */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:1360px;font-size:14px;line-height:20px}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:12px;line-height:16px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.rank{width:64px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
td .name{font-weight:600;color:var(--fg);text-decoration:none}
#main.wide{max-width:none}
.bltable{min-width:1100px}.bltable th,.bltable td{padding:8px 6px}.bltable .chip{white-space:normal}.bltable .stagesel{max-width:136px}
.bltable td:nth-child(2){min-width:170px}.bltable td:nth-child(7){min-width:130px}
.tablewrap td:nth-child(2){min-width:200px}
.tablewrap td:nth-child(7){min-width:160px}
td .name:hover{color:var(--accent);text-decoration:underline}
td .sub{font-size:12px;line-height:16px;color:var(--muted)}
.right{text-align:right}
td.right,.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.moves{display:inline-flex;flex-direction:column;margin-right:4px;vertical-align:middle}
.moves button{border:0;background:none;cursor:pointer;color:var(--muted);line-height:0;padding:1px 2px;border-radius:var(--r-sm)}
.moves button:hover{color:var(--accent);background:var(--sunk)}
.moves .ico{width:16px;height:16px}
tr.section td{background:var(--sunk);font-size:12px;line-height:16px;font-weight:600;color:var(--muted)}
.deps{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 6px;white-space:nowrap}
.dots{display:inline-flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.dots i.done{background:var(--ok);border-color:var(--ok)} .dots i.prog{background:var(--warn);border-color:var(--warn)} .dots i.late{background:var(--bad);border-color:var(--bad)} .dots i.na{opacity:.35}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(164px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px;border-top:4px solid var(--sc)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{display:flex;justify-content:space-between;font-size:14px;line-height:20px;margin-bottom:12px}
.col h3 span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;display:grid;gap:8px;font-size:14px;line-height:20px}
.card:hover{border-color:var(--muted)}
.card[draggable="true"]{cursor:grab}
.card .t{font-weight:600}
.card .m{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;font-size:12px;line-height:16px;color:var(--muted)}

/* timeline */
.tl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl-inner{position:relative;width:max-content;min-width:100%}
.tl-row{display:flex;height:40px;border-top:1px solid var(--line)}
.tl-row.head{height:48px;border-top:0;background:var(--sunk)}
.tl-name{position:sticky;left:0;z-index:3;flex:none;width:var(--namew);background:var(--surface);border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14px;overflow:hidden;white-space:nowrap}
.tl-row.head .tl-name{background:var(--sunk)}
.tl-name a{color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.tl-name a:hover{color:var(--accent);text-decoration:underline}
.tl-name .rk{color:var(--muted);font-size:12px;width:20px;font-variant-numeric:tabular-nums}
.tl-track{position:relative;flex:none}
.tl-month{position:absolute;top:4px;font-size:12px;line-height:16px;font-weight:600;color:var(--muted);padding-left:4px;border-left:1px solid var(--line);height:40px}
.tl-wk{position:absolute;bottom:4px;font-size:11px;line-height:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.6}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.bar{position:absolute;top:9px;height:22px;border-radius:var(--r-sm);background:var(--sc);color:var(--bar-ink);font-size:12px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:2}
.bar.inprog{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bar-ink) 22%,transparent) 0 6px,transparent 6px 12px)}
.bar-after{position:absolute;top:10px;font-size:12px;line-height:20px;color:var(--muted);white-space:nowrap;z-index:2}
.tl svg.links{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.bar.uat{opacity:.35;z-index:1}
.bar.done{opacity:.55}
.tl-row.sep{height:28px;background:var(--sunk)}.tl-row.sep .tl-name{background:var(--sunk)}
.tl.panning{cursor:grabbing;user-select:none}
.tl{--namew:224px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:12px;line-height:16px;color:var(--muted)}

/* capacity */
.capgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px}
@media (max-width:820px){.capgrid{grid-template-columns:1fr}}
.field{display:grid;gap:4px;margin-bottom:16px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;line-height:16px;color:var(--muted)}
.big{font-size:32px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.util{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);padding-top:12px;overflow-x:auto}
.util div{flex:1 0 8px;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.util div.free{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.utilx{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.prose{font-size:14px;line-height:20px;color:var(--muted);margin:12px 0 0}

/* alerts */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix table{min-width:800px}
.matrix input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.matrix tr.me td{background:var(--accent-soft)}
.feed li{align-items:flex-start}
.feed .when{font-size:12px;color:var(--muted)}

/* floating detail panel: the only place with a shadow */
#scrim{position:fixed;inset:0;background:rgba(20,26,23,.4);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100%);background:var(--bg);z-index:41;box-shadow:var(--float-shadow);border-left:1px solid var(--line);overflow-y:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 24px;z-index:2;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dh h2{font-size:24px;line-height:32px}
.dh .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.db{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.db > *{min-width:0}
.stepper{display:flex;flex-wrap:wrap;gap:4px;counter-reset:st}
.stepper button{flex:1 0 auto;display:flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.stepper button::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:18px;height:18px;border-radius:var(--r-sm);background:var(--sunk);font-size:11px;font-variant-numeric:tabular-nums}
.stepper button.past{color:var(--fg)}
.stepper button.past::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.stepper button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper button.cur::before{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.stepper button:not([disabled]):not(.cur):hover{border-color:var(--muted)}
.stepper button[disabled]{cursor:default}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.facts .v{font-weight:600;margin-top:4px;font-size:14px}
.facts input,.facts select{width:100%}
.dtable{width:100%;min-width:720px;table-layout:fixed}
.dtable th:nth-child(1){width:22%}.dtable th:nth-child(2){width:15%}.dtable th:nth-child(3){width:15%}.dtable th:nth-child(4){width:14%}.dtable th:nth-child(5){width:34%}
.dtable td{overflow:hidden}
.dtable select{width:100%}
.linktext{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:16px}
.filters .f{display:grid;gap:4px}
.filters .f label,.filters .f .label{font-size:12px;line-height:16px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;min-height:40px;padding:0 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.filters .count{font-size:12px;line-height:16px;color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.deptag{display:inline-block;font-size:11px;line-height:16px;font-weight:600;padding:0 4px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.deprows{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.deprows li{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 12px;font-size:14px;line-height:20px;background:var(--surface)}
.deprows li > span{min-width:0}
.deprows a{font-weight:600}
.depform{display:grid;gap:8px;margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:var(--r)}
.depform .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.depform select{max-width:100%}

function wouldCycle(pid,depId){ // does depId (transitively) depend on pid?
  const seen=new Set();const st=[depId];
  while(st.length){const x=st.pop();if(x===pid)return true;if(seen.has(x))continue;seen.add(x);const q=byId(x);if(q)st.push(...q.deps.map(d=>d.id))}
  return false;
}

// ---------- forecast engine ----------
// Weekly simulation: roadmap capacity (dev-weeks per week) is handed out in priority order:
// in-flight work first, then committed projects, then everything else, each by rank.
// "Start" means a project enters In Development; "finish" means it is released
// (development done plus the UAT and release weeks set on the Capacity page).
// Start-type dependencies hold a project back from taking capacity; finish-type dependencies
// hold back its release. A project never takes more developers than its max team size.
const UATW=()=>Math.max(0,+S.capacity.uatWeeks||0);
const relW=f=>f.finish+1+UATW();
function reachedOn(q,stage){ // date a project first reached a stage it has already passed, from its history
  const h=(q.history||[]).filter(x=>SI(x.to)>=SI(stage)).map(x=>x.date).sort()[0];return h?new Date(h+'T00:00:00'):null}
function depWeek(F,d){ // week a dependency is met, including any lag in days
  const m=msWeek(F,d.id,d.on),lag=Math.max(0,+d.lag||0);
  if(!lag||m===null)return m;
  if(m===-Infinity){const q=byId(d.id),t=q&&reachedOn(q,d.on);if(!t)return -Infinity;t.setDate(t.getDate()+lag);const w=Math.ceil((t-monday)/(7*864e5));return w<=0?-Infinity:w}
  return m+Math.ceil(lag/7);
}
function msWeek(F,qid,stage){ // week project qid reaches stage: -Infinity if already there, null if not yet known
  const q=byId(qid); if(!q||SI(q.stage)>=SI(stage))return -Infinity;
  const f=F[qid]; if(!f)return -Infinity;
  if(SI(stage)<=SI('dev'))return f.start;
  if(f.finish==null)return null;
  return stage==='uat'?f.finish+1:f.finish+1+UATW();
}
function forecast(){
  const cap=S.capacity.devs*S.capacity.roadmapPct/100;
  const rk=ranked();
  const order=[...rk.filter(p=>ACTIVE.has(p.stage)),...rk.filter(p=>!ACTIVE.has(p.stage))];
  const F={}; const used=[];
  for(const p of order){const size=+p.estimate||+p.budget||0;F[p.id]={rem:Math.max(0,size*(1-(ACTIVE.has(p.stage)?p.progress:0)/100)),start:ACTIVE.has(p.stage)?0:null,done:null,finish:null,noEst:!p.estimate,fromBudget:!p.estimate&&!!p.budget,noSize:!size&&!ACTIVE.has(p.stage)}}
  const H=260;
  for(let w=0;w<H;w++){
    let left=cap;
    for(const p of order){
      const f=F[p.id]; if(f.done!==null||f.noSize)continue;
      if(f.start===null&&!p.deps.filter(d=>d.then==='start').every(d=>{const m=depWeek(F,d);return m!==null&&m<=w}))continue;
      if(f.rem<=1e-9){f.start??=w;f.done=w;continue}
      if(left<=1e-9)continue;
      const a=Math.min(left,p.maxDevs||1,f.rem);
      f.start??=w; f.rem-=a; left-=a;
      if(f.rem<=1e-9)f.done=w;
    }
    for(let changed=true;changed;){changed=false;
      for(const p of order){const f=F[p.id];
        if(f.done===null||f.finish!==null)continue;
        if(p.deps.filter(d=>d.then==='finish').every(d=>{const m=depWeek(F,d);return m!==null&&w+1+UATW()>=m})){f.finish=w;changed=true}
      }}
    used.push(cap-left);
    if(order.every(p=>F[p.id].finish!==null||F[p.id].noSize))break;
  }
  for(const p of order){const f=F[p.id];
    if(ACTIVE.has(p.stage))f.inflight=true;
    if(f.start!==null&&!f.inflight){
      for(const d of p.deps.filter(d=>d.then==='start')){const m=depWeek(F,d);if(m===f.start&&m>0)f.waitingOn=d}
    }
    if(f.done!==null&&f.finish!==null&&f.finish>f.done)f.heldBy=p.deps.find(d=>d.then==='finish');
    if(f.start===null||f.finish===null)f.unsched=true;
  }
  return {F,used,cap};
}

// ---------- alerts ----------
function setStage(p,to){
  if(!canEdit()||p.stage===to)return;
  const from=p.stage;p.stage=to;
  if(to==='released'||to==='review')p.progress=100;
  if(ACTIVE.has(to)&&!p.committed){p.committed=true;const i=S.projects.indexOf(p);S.projects.splice(i,1);const last=S.projects.map(q=>isOpen(q)&&q.committed).lastIndexOf(true);S.projects.splice(last+1,0,p)}
  p.history.push({date:new Date().toISOString().slice(0,10),from,to,by:R().name});
  const roles=ROLES.filter(r=>(S.subs[r.id]||[]).includes(to)).map(r=>r.id);
  S.alerts.unshift({date:new Date().toISOString().slice(0,10),pid:p.id,stage:to,roles,by:R().name});
  save();
  toast(`${p.name} moved to ${SNAME(to)}.`+(roles.length?` Alert sent to ${roles.map(r=>ROLES.find(x=>x.id===r).name.replace(' (you)','')).join(', ')}.`:' Nobody is subscribed to this stage.'));
  render();
}

function vTimeline(){
  const {F}=forecast();
  const open=ranked();
  const shipped=S.projects.filter(p=>DONE.has(p.stage));
  const wkOf=d=>d?Math.floor(daysBetween(monday,d)/7):null;
  const devStart=p=>wkOf(reachedOn(p,'dev'));
  const firstPast=Math.min(0,...open.filter(p=>F[p.id].inflight).map(p=>devStart(p)??0),...shipped.map(p=>devStart(p)??wkOf(reachedOn(p,'released'))??0));
  const P=Math.min(78,Math.max(26,-firstPast+4));
  const max=Math.max(0,...open.map(p=>F[p.id].finish??0));
  const N=Math.min(156,Math.max(52,max+8)); const W=24; const RH=40; const HH=48; const TW=(P+N)*W;
  const X=w=>(w+P)*W;
  let months='',grid='';
  for(let w=-P;w<N;w++){const t=wkDate(w);const prev=wkDate(w-1);
    if((w===-P&&wkDate(w+3).getMonth()===t.getMonth())||(w>-P&&t.getMonth()!==prev.getMonth()))months+=`<div class="tl-month" style="left:${X(w)}px">${t.toLocaleDateString('en-US',{month:'short'})}${t.getMonth()===0||w<=-P+3?' '+t.getFullYear():''}</div>`;
    if((w+P)%4===0)months+=`<div class="tl-wk" style="left:${X(w)+3}px">${t.getDate()}</div>`;
    if(t.getMonth()!==prev.getMonth())grid+=`<div class="tl-grid" style="left:${X(w)}px"></div>`;
  }
  const rowsList=[...open,...shipped];
  const idx={};rowsList.forEach((p,i)=>idx[p.id]=i);
  const s0=p=>{const f=F[p.id];return f&&f.inflight?Math.min(0,devStart(p)??0):f?f.start:null};
  let links='';
  open.forEach((p,i)=>{const f=F[p.id];if(f.start==null)return;
    p.deps.forEach(d=>{if(idx[d.id]==null)return;const m=depWeek(F,d);if(m===null||m===-Infinity||f.finish==null)return;
      const x1=X(m), y1=HH+idx[d.id]*RH+RH/2, x2=X(d.then==='start'?f.start:relW(f)), y2=HH+i*RH+RH/2, mx=d.then==='start'?Math.max(x1+6,x2-6):x2+8;
      links+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="${x1}" cy="${y1}" r="2" fill="var(--muted)"/><circle cx="${x2}" cy="${y2}" r="3" fill="var(--accent)"/>`;
    })});
  const rows=open.map((p,i)=>{const f=F[p.id];const st=s0(p);
    const bar=f.start==null?`<div class="bar-after" style="left:${X(0)+8}px">Can't be scheduled: ${f.noSize?'needs an estimate or a budget':'check its dependencies'}</div>`:
      `<div class="bar ${f.inflight?'inprog':''}" data-open="${p.id}" style="--sc:var(--s-${p.stage});left:${X(st)}px;width:${Math.max(1,f.finish-st+1)*W-2}px" title="${esc(p.name)}: development ${fmtW(st)} to ${fmtW(f.finish+1)}">${(f.finish-st+1)*W>110?esc(SNAME(p.stage)):''}</div>${relW(f)>f.finish+1?`<div class="bar uat" style="--sc:var(--s-uat);left:${X(f.finish+1)}px;width:${(relW(f)-f.finish-1)*W-2}px" title="UAT and release"></div>`:''}<div class="bar-after" style="left:${X(relW(f))+6}px">${fmtW(relW(f))}</div>`;
    return `<div class="tl-row"><div class="tl-name"><span class="rk">${i+1}</span>${plink(p)}</div><div class="tl-track" style="width:${TW+120}px">${grid}${bar}</div></div>`}).join('');
  const done=shipped.map(p=>{const a=devStart(p),r=wkOf(reachedOn(p,'released'));
    const bar=a==null||r==null?`<div class="bar-after" style="left:${X(-P)+8}px">No dates recorded</div>`:`<div class="bar done" data-open="${p.id}" style="--sc:var(--s-${p.stage});left:${X(a)}px;width:${Math.max(1,r-a)*W-2}px" title="${esc(p.name)}: development ${fmtW(a)}, released ${fmtD(reachedOn(p,'released').toISOString().slice(0,10))}">${(r-a)*W>110?'Shipped':''}</div><div class="bar-after" style="left:${X(r)+6}px">Released ${fmtD(reachedOn(p,'released').toISOString().slice(0,10))}</div>`;
    return `<div class="tl-row shipped"><div class="tl-name"><span class="rk"></span>${plink(p)}</div><div class="tl-track" style="width:${TW+120}px">${grid}${bar}</div></div>`}).join('');
  const H=HH+rowsList.length*RH+(shipped.length?28:0);
  return viewHead('Timeline','Solid bars are development, pale bars are UAT and release, and striped bars are already in progress. Shipped work sits at the bottom. Scroll sideways, or hold the middle mouse button and drag, to move back and forward in time.',`<button class="btn sm" data-act="tltoday">Jump to this week</button>`)+
   `<div class="tl" id="tl"><div class="tl-inner"><div class="tl-row head"><div class="tl-name"><span class="label">Project</span></div><div class="tl-track" style="width:${TW+120}px">${months}</div></div>${rows}
   ${shipped.length?`<div class="tl-row sep"><div class="tl-name"><span class="label">Shipped</span></div><div class="tl-track" style="width:${TW+120}px"></div></div>${done}`:''}
   <svg class="links" style="left:var(--namew);width:${TW}px;height:${H}px">${links}</svg>
   ${S.releases.filter(r=>r.status!=='released').map(r=>{const x=X(0)+daysBetween(monday,parseD(r.date))/7*W;return x>=0&&x<=TW?`<div class="tl-rel" style="left:calc(var(--namew) + ${x.toFixed(1)}px);height:${H}px"><span>${esc(r.name)}</span></div>`:''}).join('')}
   <div class="tl-today" style="left:calc(var(--namew) + ${X(0)}px);top:0;height:${H}px" title="This week"></div></div></div>
   <div class="legend">${STAGES.filter(s=>!DONE.has(s.id)).map(s=>`<span>${stageChip(s.id)}</span>`).join('')}<span><span style="display:inline-block;width:2px;height:12px;background:var(--bad);vertical-align:middle"></span> This week</span></div>`;
}

// ---------- releases: helpers that need the forecast ----------
const relById=id=>(S.releases||[]).find(r=>r.id===id);
const relProjects=r=>S.projects.filter(p=>p.releaseId===r.id);
const readyDate=f=>f&&f.finish!=null?wkDate(relW(f)):null;
const actDue=(r,a)=>addDays(r.date,a.off);
const actLate=(r,a)=>a.status!=='done'&&parseD(actDue(r,a))<today0;
const canTeam=team=>canEdit()||ROLE_TEAM[role]===team;
function projRisk(r,p,F){
  if(DONE.has(p.stage))return {k:'shipped'};
  const rd=readyDate(F[p.id]);if(!rd)return {k:'unknown'};
  const slack=daysBetween(rd,parseD(r.date));
  return {k:slack<0?'risk':slack<7?'tight':'ok',days:slack,rd};
}
function riskPill(x){
  if(x.k==='shipped')return '<span class="pill ok">Already shipped</span>';
  if(x.k==='unknown')return '<span class="pill n">No forecast</span>';
  if(x.k==='risk')return `<span class="pill bad">Ready ${-x.days} days late</span>`;
  if(x.k==='tight')return `<span class="pill warn">Ready ${x.days} days before</span>`;
  return `<span class="pill ok">Ready ${x.days} days early</span>`;
}
function relStats(r,F){
  const ps=relProjects(r);const risks=ps.map(p=>projRisk(r,p,F));
  const acts=r.activities;const done=acts.filter(a=>a.status==='done').length;
  return {ps,risks,atRisk:risks.filter(x=>x.k==='risk').length,onTime:risks.filter(x=>x.k==='ok'||x.k==='tight'||x.k==='shipped').length,done,total:acts.length,late:acts.filter(a=>actLate(r,a)).length,blocked:acts.filter(a=>a.status==='blocked').length};
}
const countdown=s=>{const n=daysBetween(today0,parseD(s));return n===0?'Today':n>0?`In ${n} days`:`${-n} days ago`};
const relStatusPill=r=>`<span class="pill ${r.status==='released'?'ok':r.status==='locked'?'warn':'n'}">${REL_STATUS.find(x=>x[0]===r.status)[1]}</span>`;
const bar=(n,t)=>`<div class="pbar" role="img" aria-label="${n} of ${t} done"><i style="width:${t?Math.round(n/t*100):0}%"></i></div>`;
const relChip=r=>`<a class="chip" href="#release-${r.id}">${esc(r.name)}</a>`;
function newRelease(name,date){
  const id=S.nextRelId++;const r={id,name,date,status:'planning',theme:'',activities:makeActs(),updates:[]};
  S.releases.push(r);return r;
}
function addToRelease(ids,rid){ids.forEach(id=>{const p=byId(id);if(p&&!DONE.has(p.stage))p.releaseId=rid})}
function relAlert(r,msg,roles){
  roles=roles||['exec','marketing','support','cs','dev','product'];
  S.alerts.unshift({kind:'release',date:isoD(today0),rid:r.id,msg,roles,by:R().name});
  r.updates.unshift({date:isoD(today0),by:R().name,msg});
}
function suggestBundles(F){
  const loose=ranked().filter(p=>!p.releaseId&&F[p.id]&&F[p.id].finish!=null);
  const groups={};
  for(const p of loose){const rd=readyDate(F[p.id]);const {y,q}=quarterOf(rd);const k=`${y}-${q}`;(groups[k]??={y,q,ps:[]}).ps.push(p)}
  return Object.values(groups).sort((a,b)=>a.y-b.y||a.q-b.q).map(g=>{
    const existing=S.releases.find(r=>{const t=parseD(r.date);const qq=quarterOf(t);return qq.y===g.y&&qq.q===g.q&&r.status!=='released'});
    return {...g,existing};
  });
}

// ---------- releases: one release ----------
let relId=null, confirmRelDel=false;

    <div class="relhead-ctl"><div class="f"><label for="r-date">Release date</label><input type="date" id="r-date" data-rf="date" value="${r.date}" ${dis}></div>

  const kpis=`<div class="relkpis panel"><div><span class="label">Release date</span><b class="num">${fmtD(r.date)}</b><span class="muted">${countdown(r.date)}</span></div>
    <div><span class="label">Projects ready in time</span><b class="num">${st.onTime} of ${st.ps.length}</b>${st.atRisk?`<span class="pill bad">${st.atRisk} late</span>`:'<span class="muted">All on track</span>'}</div>
    <div><span class="label">Activities done</span><b class="num">${st.done} of ${st.total}</b>${bar(st.done,st.total)}</div>
    <div><span class="label">Needs attention</span><b class="num">${st.late+st.blocked}</b><span class="muted">${st.late} overdue · ${st.blocked} blocked</span></div></div>`;
  // projects
  const others=ranked().filter(p=>p.releaseId!==r.id);
  const projRows=st.ps.map((p,i)=>{const f=F[p.id]||{};const x=st.risks[i];const ds=['uat','mkt','sys'].map(k=>{const dl=DELIVS.find(d=>d.id===k);const s=delState(p,dl);return `<span class="pill ${s==='done'?'ok':s==='late'?'bad':s==='prog'?'warn':'n'}" title="${dl.name}">${dl.name.replace('Documentation','docs').replace('System ','System ')}: ${DSTATUS.find(z=>z[0]===p.deliverables[k].status)[1]}</span>`}).join(' ');
    return `<tr><td><a class="name" href="#project-${p.id}" data-open="${p.id}">${esc(p.name)}</a><div class="sub">${esc(p.owner)}</div></td><td>${stageChip(p.stage)}</td><td class="num">${DONE.has(p.stage)?'Shipped':f.finish!=null?fmtW(relW(f)):NONE}</td><td>${riskPill(x)}</td><td><div class="deps">${ds}</div></td><td class="right">${ed?`<button class="btn sm ghost" data-relrm="${p.id}">Remove</button>`:''}</td></tr>`}).join('');
  const projTable=`<section class="panel"><header><h2>Projects in this release</h2><span class="muted">${st.ps.length}</span></header><div class="body">
    <div style="overflow-x:auto"><table class="reltable"><thead><tr><th>Project</th><th>Stage</th><th>Forecast ready</th><th>Against release date</th><th>Hand-offs</th><th></th></tr></thead><tbody>${projRows||'<tr><td colspan="6" class="muted">No projects yet. Add one below or from the backlog.</td></tr>'}</tbody></table></div>
    ${ed?`<div class="row" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><select id="r-addp" data-relpick="1" aria-label="Add a project"><option value="">Add a project…</option>${others.map(p=>`<option value="${p.id}">${esc(p.name)}${p.releaseId?' (in '+esc(relById(p.releaseId)?.name||'')+')':''}</option>`).join('')}</select></div>`:''}
  </div></section>`;
  // swimlane of activities
  const offs=r.activities.map(a=>a.off);const minO=Math.min(-42,...offs)-3,maxO=Math.max(7,...offs)+3;const span=maxO-minO;
  const pos=o=>((o-minO)/span*100).toFixed(2);
  const todayOff=daysBetween(parseD(r.date),today0);
  const teams=REL_TEAMS.filter(t=>r.activities.some(a=>a.team===t));
  const swim=`<section class="panel"><header><h2>Release runway</h2><span class="muted">Every activity, by team, against the release date</span></header><div class="body"><div class="swim">
    ${teams.map(t=>`<div class="sw-row ${t===myTeam?'mine':''}"><span class="sw-name">${t}</span><div class="sw-track">${r.activities.filter(a=>a.team===t).map(a=>`<i class="sw-dot ${actLate(r,a)?'late':a.status}" style="left:${pos(a.off)}%" title="${esc(a.name)}: ${fmtD(actDue(r,a))}, ${ACT_STATUS.find(s=>s[0]===a.status)[1]}"></i>`).join('')}</div></div>`).join('')}
    <div class="sw-row sw-axis"><span class="sw-name"></span><div class="sw-track">${[-42,-28,-14,0].filter(o=>o>=minO).map(o=>`<span class="sw-tick" style="left:${pos(o)}%">${o===0?'Release':o/7+' wk'}</span>`).join('')}</div></div>
    <div class="sw-line rel" style="left:calc(var(--swn) + (100% - var(--swn)) * ${pos(0)/100})"></div>

  </div><div class="legend"><span><i class="sw-dot done sw-key"></i> Done</span><span><i class="sw-dot prog sw-key"></i> In progress</span><span><i class="sw-dot todo sw-key"></i> Not started</span><span><i class="sw-dot blocked sw-key"></i> Blocked</span><span><i class="sw-dot late sw-key"></i> Overdue</span><span><span style="display:inline-block;width:2px;height:12px;background:var(--bad);vertical-align:middle"></span> Today</span></div></div></section>`;
  // team cards
  const order=[...teams.filter(t=>t===myTeam),...teams.filter(t=>t!==myTeam)];
  const teamCards=order.map(t=>{const acts=r.activities.filter(a=>a.team===t).sort((a,b)=>a.off-b.off);const done=acts.filter(a=>a.status==='done').length;const can=canTeam(t);

          ${can?`<div class="linkin"><input type="url" id="a-${a.id}-l" data-act-id="${a.id}" data-ak="link" value="${esc(a.link)}" placeholder="Link to the work (https://)" aria-label="Link" class="a-link">${openBtn(a.link)}</div>`:a.link?`<a class="linktext" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.link.replace(/^https?:\/\//,''))}</a>`:''}</div>
        <div class="a-side">${can?`<select id="a-${a.id}-s" data-act-id="${a.id}" data-ak="status" aria-label="Status">${ACT_STATUS.map(([v,l])=>`<option value="${v}" ${a.status===v?'selected':''}>${l}</option>`).join('')}</select>`:`<span class="pill ${a.status==='done'?'ok':a.status==='blocked'?'warn':late?'bad':'n'}">${ACT_STATUS.find(s=>s[0]===a.status)[1]}</span>`}
          ${ed?`<div class="a-due"><label class="muted" for="a-${a.id}-d">Due</label><input type="date" id="a-${a.id}-d" data-act-id="${a.id}" data-ak="due" value="${actDue(r,a)}"></div><button class="btn sm ghost" data-actrm="${a.id}" aria-label="Remove activity">Remove</button>`:''}</div></li>`}).join('')}</ul>
      ${ed?`<button class="btn sm ghost" data-actadd="${esc(t)}"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add activity</button>`:''}
    </div></section>`}).join('');
  const updates=`<section class="panel"><header><h2>Team updates</h2><span class="muted">Sent to C-Suite, Marketing, Support and CS</span></header><div class="body">
    ${ed?`<div class="field"><label for="r-msg">Send an update</label><textarea id="r-msg" rows="2" placeholder="For example: Scope is locked. Marketing materials are due 06-Dec-2026."></textarea><div><button class="btn primary sm" data-act="relsend">Send update</button></div></div>`:''}
    ${r.updates.length?`<ul class="list feed">${r.updates.map(u=>`<li><div class="t"><div style="color:var(--fg);font-size:14px">${esc(u.msg)}</div><div>${esc(u.by)}</div></div><div class="r when">${fmtD(u.date)}</div></li>`).join('')}</ul>`:'<p class="empty">No updates sent yet.</p>'}
  </div></section>`;
  const note=myTeam?`<div class="rolenote"><b>${esc(R().name)}</b><span>Your team's activities are first. You can update their status, owner and link.</span></div>`:roleNote();
  return head+note+kpis+projTable+swim+`<h2 style="margin:32px 0 12px">Activities by team</h2><div class="teamgrid">${teamCards}</div><div class="grid2">${updates}</div>`+
   (ed?`<div style="margin-top:24px"><button class="btn danger" data-act="reldel">${confirmRelDel?'Delete this release? Its projects stay in the backlog. Click again to confirm':'Delete release'}</button></div>`:'');
}

let view='home';
function route(){
  const h=location.hash.slice(1);
  const m=h.match(/^project-(\d+)$/), mr=h.match(/^release-(\d+)$/);

  else if(mr){openId=null;view='release';relId=+mr[1];confirmRelDel=false;window.scrollTo(0,0)}
  else{openId=null;if(VIEWS.some(v=>v[0]===h))view=h}

}
function render(){

  const fn={home:vHome,backlog:vBacklog,board:vBoard,timeline:vTimeline,releases:vReleases,release:vRelease,capacity:vCapacity,alerts:vAlerts}[view];
  const mainEl=document.getElementById('main');mainEl.classList.toggle("wide",view==="backlog"||view==="board"||view==="timeline");const oldTl=document.getElementById('tl');const keepX=oldTl&&view==='timeline'?oldTl.scrollLeft:null;mainEl.innerHTML=fn();
  if(view==='timeline'){if(keepX!=null)document.getElementById('tl').scrollLeft=keepX;else tlToday()}
  drawer();
}
const curHash=()=>view==='release'?'release-'+relId:view;
function closeDrawer(){openId=null;confirmDel=null;history.replaceState(null,'','#'+curHash());drawer()}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target;
  const op=t.closest('[data-open]');
  if(op&&!t.closest('button')){e.preventDefault();openId=+op.dataset.open;confirmDel=null;history.replaceState(null,'','#project-'+openId);drawer();document.getElementById('drawer').scrollTop=0;return}
  const mv=t.closest('[data-move]');
  if(mv&&canEdit()&&false){const id=+mv.dataset.move,dir=+mv.dataset.dir;const L=ranked();const i=L.findIndex(p=>p.id===id);const p=L[i];const j=i+dir;
    const q=L[j];
    if(q&&q.committed===p.committed){[L[i],L[j]]=[L[j],L[i]]}
    else if(p.committed&&dir>0){if(ACTIVE.has(p.stage))return;p.committed=false;toast(`${p.name} moved to everything else.`)}
    else if(!p.committed&&dir<0){p.committed=true;toast(`${p.name} is now committed.`)}
    else return;
    S.projects=[...L,...S.projects.filter(x=>DONE.has(x.stage))];save();render();return}
  const st=t.closest('[data-stage-to]'); if(st){setStage(byId(openId),st.dataset.stageTo);return}
  const ud=t.closest('[data-undep]'); if(ud&&canEdit()){const p=byId(+(ud.dataset.undepOf||openId));p.deps.splice(+ud.dataset.undep,1);save();render();toast('Dependency removed.');return}
  const act=t.closest('[data-act]')?.dataset.act;
  if(act==='close'||t.id==='scrim'){closeDrawer();return}
  const ed=canEdit(); const r=view==='release'?relById(relId):null;
  if(act==='newrel'&&ed){const t0=new Date(today0);t0.setDate(t0.getDate()+60);const nr=newRelease('New release',isoD(t0));save();location.hash='release-'+nr.id;return}
  const bd=t.closest('[data-bundle]'); if(bd&&ed){const {F}=forecast();const g=suggestBundles(F).find(x=>`${x.y}-${x.q}`===bd.dataset.bundle);if(!g)return;const rel=g.existing||newRelease(quarterName(g.y,g.q),quarterTarget(g.y,g.q));addToRelease(g.ps.map(x=>x.id),rel.id);save();render();toast(`${g.ps.length} ${g.ps.length===1?'project':'projects'} added to ${rel.name}.`);return}
  const rrm=t.closest('[data-relrm]'); if(rrm&&ed){byId(+rrm.dataset.relrm).releaseId=null;save();render();toast('Removed from the release.');return}
  const aa=t.closest('[data-actadd]'); if(aa&&ed&&r){const id=Math.max(0,...r.activities.map(a=>a.id))+1;r.activities.push({id,team:aa.dataset.actadd,name:'New activity',off:-7,status:'todo',owner:TEAM_OWNER[aa.dataset.actadd]||'',link:''});save();render();setTimeout(()=>document.getElementById(`a-${id}-n`)?.select(),0);return}
  const ar=t.closest('[data-actrm]'); if(ar&&ed&&r){r.activities=r.activities.filter(a=>a.id!==+ar.dataset.actrm);save();render();toast('Activity removed.');return}
  if(act==='relsend'&&ed&&r){const m=document.getElementById('r-msg').value.trim();if(!m){toast('Write the update first, then send it.');return}relAlert(r,m);save();render();toast('Update sent to C-Suite, Marketing, Support and Customer Success.');return}
  if(act==='reldel'&&ed&&r){if(!confirmRelDel){confirmRelDel=true;render();return}S.projects.forEach(p=>{if(p.releaseId===r.id)p.releaseId=null});S.releases=S.releases.filter(x=>x!==r);save();location.hash='releases';toast('Release deleted. Its projects are still in the backlog.');return}
  if(act==='bulkclear'){SEL.clear();render();return}
  if(act==='bulkrm'&&ed){SEL.forEach(id=>{const p=byId(id);if(p)p.releaseId=null});const n=SEL.size;SEL.clear();save();render();toast(`${n} ${n===1?'project':'projects'} removed from their release.`);return}
  const bs=t.closest('[data-bfsec]'); if(bs){BF.sec=bs.dataset.bfsec;saveBF();render();return}
  if(act==='clearbf'){BF={...BF0};saveBF();render();return}
  if(act==='tltoday'){tlToday(true);return}
  if(act==='adddep'&&canEdit()){const p=byId(openId);const lag=Math.max(0,Math.round(+depDraft.lag||0));const d={id:+depDraft.id,on:depDraft.on,then:depDraft.then};if(lag)d.lag=lag;if(!d.id||wouldCycle(p.id,d.id))return;if(!p.deps.some(x=>sameDep(x,d)))p.deps.push(d);depDraft.id='';depDraft.lag=0;save();render();toast('Dependency added. Forecasts updated.');return}
  if(act==='add'&&canEdit()){const id=S.nextId++;S.projects.push({id,name:'New project',stage:'intake',progress:0,owner:'Unassigned',budget:0,estimate:0,maxDevs:3,deps:[],summary:'',history:[],deliverables:del()});save();openId=id;history.replaceState(null,'','#project-'+id);render();setTimeout(()=>document.getElementById('p-name')?.select(),0);return}
  if(act==='delete'&&canEdit()){if(confirmDel!==openId){confirmDel=openId;drawer();return}const id=openId;S.projects=S.projects.filter(p=>p.id!==id);S.projects.forEach(p=>p.deps=p.deps.filter(x=>x.id!==id));S.alerts=S.alerts.filter(a=>a.pid!==id);save();closeDrawer();render();toast('Project deleted.');return}
  if(act==='reset'){S=seed();save();openId=null;render();toast('Sample data restored.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeDrawer();if(e.key==='Enter'&&e.target.matches('.card[data-open]'))e.target.click()});
document.addEventListener('change',e=>{
  if(e.target.dataset?.bstage){const q=byId(+e.target.dataset.bstage);if(q)setStage(q,e.target.value);return}
  const t=e.target;
  if(t.id==='role'){role=t.value;try{localStorage.setItem(KEY+'-role',role)}catch(_){};const h=R().home;if(!openId){view=h;history.replaceState(null,'','#'+view)}render();toast(`Now viewing as ${R().name}.`);return}
  if(t.dataset.actId){const r=relById(relId);const a=r&&r.activities.find(x=>x.id===+t.dataset.actId);if(!a)return;const k=t.dataset.ak;
    if((k==='name'||k==='due')&&!canEdit())return; if(!canTeam(a.team))return;
    if(k==='due'){if(t.value)a.off=daysBetween(parseD(r.date),parseD(t.value))}else a[k]=t.value;
    save();render();if(k!=='status')document.getElementById(t.id)?.focus();if(k==='status')toast(`${a.name}: ${ACT_STATUS.find(s=>s[0]===a.status)[1]}.`);return}
  if(t.dataset.pick){const id=+t.dataset.pick;t.checked?SEL.add(id):SEL.delete(id);render();return}
  if(t.dataset.bf){BF[t.dataset.bf]=t.value;saveBF();render();document.getElementById(t.id)?.focus();return}
  if(!canEdit()&&!t.dataset.sub)return;
  if(t.dataset.bulk&&t.value){const {F}=forecast();const ids=[...SEL].filter(id=>byId(id)&&!DONE.has(byId(id).stage));let rel;
    if(t.value==='new'){const last=ids.map(id=>readyDate(F[id])).filter(Boolean).sort((a,b)=>b-a)[0]||new Date(today0);const {y,q}=quarterOf(last);rel=newRelease(quarterName(y,q),quarterTarget(y,q))}else rel=relById(+t.value);
    addToRelease(ids,rel.id);SEL.clear();save();render();toast(`${ids.length} ${ids.length===1?'project':'projects'} added to ${rel.name}.`);return}
  if(t.dataset.reladd&&t.value){byId(+t.dataset.reladd).releaseId=+t.value;save();render();toast('Added to the release.');return}
  if(t.dataset.relpick&&t.value){byId(+t.value).releaseId=relId;save();render();toast('Project added to the release.');return}
  if(t.dataset.prel&&p){p.releaseId=t.value?+t.value:null;save();render();return}
  if(t.dataset.rf){const r=relById(relId);if(!r)return;const k=t.dataset.rf;if(k==='date'&&!t.value)return;const old=r[k];r[k]=t.value;
    if(k==='status'&&old!==t.value)relAlert(r,`Status changed to ${REL_STATUS.find(x=>x[0]===t.value)[1]}.`);
    if(k==='date'&&old!==t.value)relAlert(r,`Release date moved to ${fmtD(t.value)}.`);
    save();render();document.getElementById(t.id)?.focus();return}
  const p=openId&&byId(openId);
  if(t.dataset.f==='committed'&&p){p.committed=t.value==='1';S.projects.splice(S.projects.indexOf(p),1);p.committed?S.projects.push(p):S.projects.unshift(p);S.projects=[...committedList(),...laterList(),...S.projects.filter(x=>DONE.has(x.stage))];save();render();return}
  if(t.dataset.f&&p){const k=t.dataset.f;let v=t.value;if(t.type==='number'){v=Math.max(0,+v||0);if(k==='progress')v=Math.min(100,v);if(k==='maxDevs')v=Math.max(1,v);if(k==='spent'||k==='budget'||k==='estimate')v=Math.round(v*2)/2}p[k]=v;save();render();return}
  if(t.dataset.dep&&p){const k=t.dataset.dep;if(k==='type'){const dt=DEP_TYPES.find(x=>x.id===t.value);if(dt&&dt.on){depDraft.on=dt.on;depDraft.then=dt.then}else if(dt){depDraft.on='uat'}}else depDraft[k]=t.value;drawer();document.getElementById(t.id)?.focus();return}
  if(t.dataset.dl&&p){p.deliverables[t.dataset.dl][t.dataset.k]=t.value;save();render();return}
  if(t.dataset.cap){let v=Math.max(0,+t.value||0);if(t.dataset.cap==='roadmapPct')v=Math.min(100,v);S.capacity[t.dataset.cap]=v;save();render();setTimeout(()=>document.getElementById(t.id)?.focus(),0);return}
  if(t.dataset.sub){const r=t.dataset.sub;if(!(canEdit()||r===role))return;const set=new Set(S.subs[r]||[]);t.checked?set.add(t.dataset.stage):set.delete(t.dataset.stage);S.subs[r]=[...set];save();toast('Alert preferences saved.');return}
});
// drag and drop ranking in the backlog
function placeProject(id,targetId,after,secKey){
  const p=byId(id); if(!p||DONE.has(p.stage))return;
  const L=ranked().filter(x=>x!==p); const tgt=targetId?byId(targetId):null;
  if(tgt&&DONE.has(tgt.stage))return;
  const toCommitted=tgt?tgt.committed:secKey==='committed';
  if(!toCommitted&&ACTIVE.has(p.stage)){toast(`${p.name} is in ${SNAME(p.stage)}, so it has to stay committed.`);return}
  const was=p.committed; p.committed=toCommitted;
  const idx=tgt?L.indexOf(tgt)+(after?1:0):(toCommitted?0:L.filter(x=>x.committed).length);
  L.splice(idx,0,p);
  S.projects=[...L.filter(x=>x.committed),...L.filter(x=>!x.committed),...S.projects.filter(x=>DONE.has(x.stage))];
  save();render();
  if(was!==toCommitted)toast(toCommitted?`${p.name} is now committed.`:`${p.name} moved to everything else.`);
}
function moveBy(id,dir){
  const L=ranked();const i=L.findIndex(x=>x.id===id);const j=i+dir;if(i<0||j<0||j>=L.length)return;
  const p=L[i],q=L[j];
  if(q.committed===p.committed)placeProject(id,q.id,dir>0,null);
  else placeProject(id,null,false,q.committed?'committed':'later');
}
document.addEventListener('keydown',e=>{const g=e.target.closest?.('[data-grip]');if(!g||!canEdit())return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const id=+g.dataset.grip;moveBy(id,e.key==='ArrowUp'?-1:1);document.querySelector(`[data-grip="${id}"]`)?.focus()}});
const clearDrop=()=>document.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(x=>x.classList.remove('drop-before','drop-after','drop-into'));
document.addEventListener('dragstart',e=>{const tr=e.target.closest?.('[data-rowdrag]');if(!tr)return;dragRow=+tr.dataset.rowdrag;e.dataTransfer.setData('text/plain','row:'+dragRow);e.dataTransfer.effectAllowed='move';setTimeout(()=>tr.classList.add('dragging'),0)});
document.addEventListener('dragend',()=>{dragRow=null;clearDrop();document.querySelectorAll('tr.dragging').forEach(x=>x.classList.remove('dragging'))});
document.addEventListener('dragover',e=>{if(dragRow==null)return;const tr=e.target.closest?.('tr[data-rowdrop],tr[data-secdrop]');if(!tr)return;
  if(tr.dataset.sec==='shipped'||tr.dataset.secdrop==='shipped')return;
  e.preventDefault();clearDrop();
  if(tr.dataset.secdrop)tr.classList.add('drop-into');
  else{const b=tr.getBoundingClientRect();tr.classList.add(e.clientY<b.top+b.height/2?'drop-before':'drop-after')}});
document.addEventListener('drop',e=>{if(dragRow==null)return;const tr=e.target.closest?.('tr[data-rowdrop],tr[data-secdrop]');if(!tr)return;e.preventDefault();
  const id=dragRow;dragRow=null;
  if(tr.dataset.secdrop){clearDrop();placeProject(id,null,false,tr.dataset.secdrop);return}
  const after=tr.classList.contains('drop-after');clearDrop();const tid=+tr.dataset.rowdrop;if(tid===id){render();return}placeProject(id,tid,after,null)});
