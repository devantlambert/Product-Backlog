<title>Roadmap by Dev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Dev brand tokens v1.0.0 (Roadmap). Layout: sticky app header over one working canvas, max 1200 px; project detail opens as a floating right-hand panel. */
:root{
  /* primitives */
  --dev-paper:#F6F3EC; --dev-white:#FFFFFF; --dev-paper-line:#DED8CB; --dev-ink:#1F2A24; --dev-moss:#5E665F;
  --dev-forest:#2D6A4F; --dev-slate:#3A5BA0; --dev-plum:#7B4B94; --dev-clay:#A3552A; --dev-teal:#1F7A75; --dev-gold:#9C7A12;
  --dev-leaf:#2F7D32; --dev-amber:#8A5C00; --dev-brick:#B3261E;
  /* semantic */
  --bg:var(--dev-paper); --surface:var(--dev-white); --sunk:#EFEBE1; --line:var(--dev-paper-line); --fg:var(--dev-ink); --muted:var(--dev-moss);
  --brand:var(--dev-forest); --accent:var(--dev-slate); --accent-ink:#FFFFFF; --accent-soft:#E6EAF3;
  --ok:var(--dev-leaf); --ok-soft:#E3EFE1; --warn:var(--dev-amber); --warn-soft:#F4EAD3; --bad:var(--dev-brick); --bad-soft:#F6E1DD;
  --s-intake:var(--dev-moss); --s-discovery:var(--dev-plum); --s-ready:var(--dev-slate); --s-dev:var(--dev-gold); --s-uat:var(--dev-teal); --s-released:var(--dev-leaf); --s-review:var(--dev-clay);
  --chip-bg:12%; --bar-ink:#FFFFFF;
  --float-shadow:0 8px 28px rgba(31,42,36,.16);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-sm:4px; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A17; --surface:#1C231F; --sunk:#18201C; --line:#323C36; --fg:#ECE8DF; --muted:#A3ABA4;
  --brand:#6FBF94; --accent:#8FA8DD; --accent-ink:#141A17; --accent-soft:#25304A;
  --ok:#7CC97F; --ok-soft:#1F3321; --warn:#E0B04A; --warn-soft:#3A2F15; --bad:#F08A7E; --bad-soft:#3E211D;
  --s-intake:#A3ABA4; --s-discovery:#C39BD8; --s-ready:#8FA8DD; --s-dev:#D9B64A; --s-uat:#6CC3BC; --s-released:#7CC97F; --s-review:#E39368;
  --chip-bg:18%; --bar-ink:#141A17; --float-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1C231F; --sunk:#18201C; --line:#323C36; --fg:#ECE8DF; --muted:#A3ABA4;
  --brand:#6FBF94; --accent:#8FA8DD; --accent-ink:#141A17; --accent-soft:#25304A;
  --ok:#7CC97F; --ok-soft:#1F3321; --warn:#E0B04A; --warn-soft:#3A2F15; --bad:#F08A7E; --bad-soft:#3E211D;
  --s-intake:#A3ABA4; --s-discovery:#C39BD8; --s-ready:#8FA8DD; --s-dev:#D9B64A; --s-uat:#6CC3BC; --s-released:#7CC97F; --s-review:#E39368;
  --chip-bg:18%; --bar-ink:#141A17; --float-shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:24px;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:40px} h2{font-size:20px;line-height:28px} h3{font-size:16px;line-height:24px}
a{color:var(--accent)}
b,strong{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.dev-date{white-space:nowrap;font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1232px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.btn,nav.views a,.card,select,input{transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}}

/* app header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px;line-height:28px}
.brand svg{flex:none;display:block}
nav.views{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
nav.views a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
nav.views a:hover{color:var(--fg)}
nav.views a[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.rolebox{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=url],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;min-height:40px;min-width:0;font-size:14px}
select:hover,input:hover{border-color:var(--muted)}
textarea{width:100%;resize:vertical;padding:8px 12px;line-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 16px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:32px;padding:0 8px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
@media (pointer:coarse){.btn,select,input[type=text],input[type=number],input[type=url],nav.views a{min-height:44px}}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{padding-block:32px 64px}
.viewhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.rolenote{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border:1px solid var(--line);border-left:0;background:var(--surface);border-radius:var(--r);padding:12px 16px;margin-bottom:24px;font-size:14px;line-height:20px}
.rolenote b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 0}
.panel .body{padding:12px 16px 16px}
.label{font-size:12px;line-height:16px;color:var(--muted);font-weight:600}

/* stage tag (radius 4, always with its word) */
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;padding:2px 8px 2px 6px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--sc) var(--chip-bg),transparent);color:var(--fg)}
.stage::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--sunk);color:var(--muted)}

/* home */
.pipeline{display:flex;flex-wrap:wrap;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.pipeline a{flex:var(--n) 1 0;min-width:96px;padding:12px;text-decoration:none;color:var(--fg);border-top:4px solid var(--sc);border-right:1px solid var(--line)}
.pipeline a:last-child{border-right:0}
.pipeline a:hover{background:var(--sunk)}
.pipeline b{display:block;font-size:24px;line-height:32px;font-variant-numeric:tabular-nums}
.pipeline span{font-size:12px;line-height:16px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px;margin-top:24px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px}
.list li:first-child{border-top:0}
.list .t{min-width:0}
.list .t a{font-weight:600;text-decoration:none;color:var(--fg)}
.list .t a:hover{color:var(--accent);text-decoration:underline}
.list .t div{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.list .r{text-align:right;flex:none;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:16px}
.kpis div b{display:block;font-size:20px;line-height:28px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:8px 0;margin:0}

/* table (one step tighter) */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:1040px;font-size:14px;line-height:20px}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:12px;line-height:16px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.rank{width:64px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
td .name{font-weight:600;color:var(--fg);text-decoration:none}
td .name:hover{color:var(--accent);text-decoration:underline}
td .sub{font-size:12px;line-height:16px;color:var(--muted)}
.right{text-align:right}
td.right,.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.moves{display:inline-flex;flex-direction:column;margin-right:4px;vertical-align:middle}
.moves button{border:0;background:none;cursor:pointer;color:var(--muted);line-height:0;padding:1px 2px;border-radius:var(--r-sm)}
.moves button:hover{color:var(--accent);background:var(--sunk)}
.moves .ico{width:16px;height:16px}
tr.section td{background:var(--sunk);font-size:12px;line-height:16px;font-weight:600;color:var(--muted)}
.deps{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 6px;white-space:nowrap}
.dots{display:inline-flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.dots i.done{background:var(--ok);border-color:var(--ok)} .dots i.prog{background:var(--warn);border-color:var(--warn)} .dots i.late{background:var(--bad);border-color:var(--bad)} .dots i.na{opacity:.35}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px;border-top:4px solid var(--sc)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{display:flex;justify-content:space-between;font-size:14px;line-height:20px;margin-bottom:12px}
.col h3 span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;display:grid;gap:8px;font-size:14px;line-height:20px}
.card:hover{border-color:var(--muted)}
.card[draggable="true"]{cursor:grab}
.card .t{font-weight:600}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted)}

/* timeline */
.tl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl-inner{position:relative}
.tl-row{display:flex;height:40px;border-top:1px solid var(--line)}
.tl-row.head{height:48px;border-top:0;background:var(--sunk)}
.tl-name{position:sticky;left:0;z-index:3;flex:none;width:224px;background:var(--surface);border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14px;overflow:hidden;white-space:nowrap}
.tl-row.head .tl-name{background:var(--sunk)}
.tl-name a{color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.tl-name a:hover{color:var(--accent);text-decoration:underline}
.tl-name .rk{color:var(--muted);font-size:12px;width:20px;font-variant-numeric:tabular-nums}
.tl-track{position:relative;flex:none}
.tl-month{position:absolute;top:4px;font-size:12px;line-height:16px;font-weight:600;color:var(--muted);padding-left:4px;border-left:1px solid var(--line);height:40px}
.tl-wk{position:absolute;bottom:4px;font-size:11px;line-height:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.6}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.bar{position:absolute;top:9px;height:22px;border-radius:var(--r-sm);background:var(--sc);color:var(--bar-ink);font-size:12px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:2}
.bar.inprog{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bar-ink) 22%,transparent) 0 6px,transparent 6px 12px)}
.bar-after{position:absolute;top:10px;font-size:12px;line-height:20px;color:var(--muted);white-space:nowrap;z-index:2}
.tl svg.links{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:12px;line-height:16px;color:var(--muted)}

/* capacity */
.capgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px}
@media (max-width:820px){.capgrid{grid-template-columns:1fr}}
.field{display:grid;gap:4px;margin-bottom:16px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;line-height:16px;color:var(--muted)}
.big{font-size:32px;line-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.util{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);padding-top:12px;overflow-x:auto}
.util div{flex:1 0 8px;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.util div.free{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.utilx{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.prose{font-size:14px;line-height:20px;color:var(--muted);margin:12px 0 0}

/* alerts */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix table{min-width:800px}
.matrix input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.matrix tr.me td{background:var(--accent-soft)}
.feed li{align-items:flex-start}
.feed .when{font-size:12px;color:var(--muted)}

/* floating detail panel: the only place with a shadow */
#scrim{position:fixed;inset:0;background:rgba(20,26,23,.4);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(740px,100%);background:var(--bg);z-index:41;box-shadow:var(--float-shadow);border-left:1px solid var(--line);overflow-y:auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 24px;z-index:2;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dh h2{font-size:24px;line-height:32px}
.dh .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.db{padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.db > *{min-width:0}
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;counter-reset:st}
.stepper button{flex:1 0 auto;display:flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.stepper button::before{counter-increment:st;content:counter(st);display:inline-grid;place-items:center;width:18px;height:18px;border-radius:var(--r-sm);background:var(--sunk);font-size:11px;font-variant-numeric:tabular-nums}
.stepper button.past{color:var(--fg)}
.stepper button.past::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.stepper button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper button.cur::before{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.stepper button:not([disabled]):not(.cur):hover{border-color:var(--muted)}
.stepper button[disabled]{cursor:default}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.facts .v{font-weight:600;margin-top:4px;font-size:14px}
.facts input,.facts select{width:100%}
.dtable{width:100%;min-width:620px}
.dtable input[type=url]{width:100%}
.hist li{font-size:14px}
.close{display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);width:40px;height:40px;cursor:pointer;flex:none;color:var(--fg)}
.close:hover{border-color:var(--muted)}
.p-name{font-weight:600;font-size:20px!important;width:100%}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:var(--r);z-index:60;box-shadow:var(--float-shadow);max-width:calc(100% - 32px);font-size:14px;line-height:20px}
footer.dev-footer{border-top:1px solid var(--line);margin-top:24px}
footer.dev-footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding-block:16px 24px;font-size:12px;line-height:16px;color:var(--muted)}
.dev-byline{font-size:14px;color:var(--fg)} .dev-byline b{color:var(--brand)}
@media (max-width:640px){.tl-name{width:152px}h1{font-size:24px;line-height:32px}.db,.dh{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:no-preference){#drawer{animation:slide .25s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="var(--accent)"/><rect x="6" y="15" width="3" height="7" rx="1" fill="var(--accent-ink)" opacity=".45"/><rect x="10.5" y="12" width="3" height="10" rx="1" fill="var(--accent-ink)" opacity=".65"/><rect x="15" y="9" width="3" height="13" rx="1" fill="var(--accent-ink)" opacity=".85"/><rect x="19.5" y="6" width="3" height="16" rx="1" fill="var(--accent-ink)"/></svg>
      <span>Roadmap</span>
    </div>
    <nav class="views" id="nav" aria-label="Views"></nav>
    <div class="rolebox"><label for="role">Viewing as</label><select id="role"></select></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="dev-footer"><div class="wrap"><span class="dev-byline">Roadmap by <b>Dev</b></span><span>Prototype with fictional sample data. Your edits are saved in this browser only. <button class="btn sm ghost" data-act="reset">Reset sample data</button></span></div></footer>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Project details"></aside>
<div id="toast" hidden role="status"></div>

<script>
// ---------- reference data ----------
const STAGES=[
  {id:'intake',name:'Intake'},
  {id:'discovery',name:'Discovery'},
  {id:'ready',name:'Ready for Dev'},
  {id:'dev',name:'In Development'},
  {id:'uat',name:'UAT'},
  {id:'released',name:'Released'},

const NONE='<span class="muted">Not set</span>';

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monday=(()=>{const t=new Date();t.setHours(0,0,0,0);const dd=(t.getDay()+6)%7;t.setDate(t.getDate()-dd);return t})();
const wkDate=w=>{const t=new Date(monday);t.setDate(t.getDate()+7*w);return t};
const fmt=t=>`${String(t.getDate()).padStart(2,'0')}\u2011${MON[t.getMonth()]}\u2011${t.getFullYear()}`;

const cost=p=>p.estimate*S.capacity.rate;
function budgetPill(p){
  if(!p.budget)return '<span class="pill n">No budget</span>';
  const v=p.budget-cost(p);
  if(v<0)return `<span class="pill bad">Over by ${money(-v)}</span>`;
  if(v<p.budget*.1)return `<span class="pill warn">Tight</span>`;
  return `<span class="pill ok">Within budget</span>`;
}
function delState(p,dl){
  const st=p.deliverables[dl.id].status;
  if(st==='done')return 'done'; if(st==='na')return 'na';
  if(dl.lateAt&&SI(p.stage)>=SI(dl.lateAt))return 'late';
  if(!dl.lateAt&&p.stage==='review')return st==='prog'?'prog':'late';
  return st==='prog'?'prog':'none';
}
function delDots(p){return `<span class="dots" title="Deliverables">${DELIVS.map(dl=>`<i class="${delState(p,dl)}" title="${dl.name}: ${DSTATUS.find(s=>s[0]===p.deliverables[dl.id].status)[1]}"></i>`).join('')}</span>`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function wouldCycle(pid,depId){ // does depId (transitively) depend on pid?
  const seen=new Set();const st=[depId];
  while(st.length){const x=st.pop();if(x===pid)return true;if(seen.has(x))continue;seen.add(x);const q=byId(x);if(q)st.push(...q.deps)}
  return false;
}

// ---------- forecast engine ----------
// Weekly simulation: roadmap capacity (dev-weeks per week) is handed out in priority order.
// In-flight work goes first, then the backlog by rank. A project can't take capacity until all
// its dependencies have finished, and never takes more than its max team size per week.
function forecast(){
  const cap=S.capacity.devs*S.capacity.roadmapPct/100;
  const open=S.projects.filter(p=>!DONE.has(p.stage));
  const order=[...open.filter(p=>ACTIVE.has(p.stage)),...open.filter(p=>!ACTIVE.has(p.stage))];
  const F={}; const used=[];
  for(const p of order)F[p.id]={rem:Math.max(0,p.estimate*(1-(ACTIVE.has(p.stage)?p.progress:0)/100)),start:null,finish:null,noEst:!p.estimate};
  const doneBy=(id,w)=>{const q=byId(id);if(!q||DONE.has(q.stage))return true;const f=F[id];return f&&f.finish!==null&&f.finish<w};
  const H=260;
  for(let w=0;w<H;w++){
    let left=cap;
    for(const p of order){
      const f=F[p.id]; if(f.finish!==null)continue;
      if(!p.deps.every(id=>doneBy(id,w)))continue;
      if(f.rem<=1e-9){f.start??=w;f.finish=w;continue}
      if(left<=1e-9)continue;
      const a=Math.min(left,p.maxDevs||1,f.rem);
      f.start??=w; f.rem-=a; left-=a;
      if(f.rem<=1e-9)f.finish=w;
    }
    used.push(cap-left);
    if(order.every(p=>F[p.id].finish!==null))break;
  }
  for(const p of order){const f=F[p.id];
    if(ACTIVE.has(p.stage))f.inflight=true;
    const blockers=p.deps.map(byId).filter(q=>q&&!DONE.has(q.stage));
    if(f.start!==null&&blockers.length){const lastDep=blockers.reduce((a,q)=>((F[q.id].finish??-1)>(F[a.id].finish??-1)?q:a));if(F[lastDep.id].finish===f.start-1)f.waitingOn=lastDep.id}
    if(f.start===null)f.unsched=true;
  }
  return {F,used,cap};
}

// ---------- alerts ----------
function setStage(p,to){
  if(!canEdit()||p.stage===to)return;
  const from=p.stage;p.stage=to;
  if(to==='released'||to==='review')p.progress=100;
  if(ACTIVE.has(to)&&!ACTIVE.has(from)&&SI(to)>SI(from))p.progress=p.progress||0;
  p.history.push({date:new Date().toISOString().slice(0,10),from,to,by:R().name});
  const roles=ROLES.filter(r=>(S.subs[r.id]||[]).includes(to)).map(r=>r.id);
  S.alerts.unshift({date:new Date().toISOString().slice(0,10),pid:p.id,stage:to,roles,by:R().name});
  save();
  toast(`${p.name} moved to ${SNAME(to)}.`+(roles.length?` Alert sent to ${roles.map(r=>ROLES.find(x=>x.id===r).name.replace(' (you)','')).join(', ')}.`:' Nobody is subscribed to this stage.'));
  render();
}

      if(!DONE.has(p.stage)&&!p.budget)items.push([p,'No budget assigned','warn']);
      if(p.budget&&cost(p)>p.budget&&!DONE.has(p.stage))items.push([p,`Estimate costs ${money(cost(p))} against a ${money(p.budget)} budget`,'bad']);

}

function vTimeline(){
  const {F}=forecast();
  const open=S.projects.filter(p=>!DONE.has(p.stage));
  const max=Math.max(0,...open.map(p=>F[p.id].finish??0));
  const N=Math.min(156,Math.max(26,max+4)); const W=24; const RH=38; const HH=44;
  let months='',grid='';
  for(let w=0;w<N;w++){const t=wkDate(w);const prev=wkDate(w-1);
    if(w===0||t.getMonth()!==prev.getMonth())months+=`<div class="tl-month" style="left:${w*W}px">${t.toLocaleDateString('en-US',{month:'short'})}${t.getMonth()===0||w===0?' '+t.getFullYear():''}</div>`;
    if(w%4===0)months+=`<div class="tl-wk" style="left:${w*W+3}px">${t.getDate()}</div>`;
    if(t.getMonth()!==prev.getMonth())grid+=`<div class="tl-grid" style="left:${w*W}px"></div>`;
  }
  const idx={};open.forEach((p,i)=>idx[p.id]=i);
  let links='';
  open.forEach((p,i)=>{const f=F[p.id];if(f.start==null)return;
    p.deps.forEach(did=>{const df=F[did];if(!df||df.finish==null||idx[did]==null)return;
      const x1=(df.finish+1)*W, y1=HH+idx[did]*RH+RH/2, x2=f.start*W, y2=HH+i*RH+RH/2, mx=Math.max(x1+6,x2-6);
      links+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="${x2}" cy="${y2}" r="2.5" fill="var(--muted)"/>`;
    })});
  const rows=open.map((p,i)=>{const f=F[p.id];
    const bar=f.start==null?`<div class="bar-after" style="left:8px">Can't be scheduled: ${p.estimate?'check dependencies':'needs an estimate'}</div>`:
      `<div class="bar ${f.inflight?'inprog':''}" data-open="${p.id}" style="--sc:var(--s-${p.stage});left:${f.start*W}px;width:${Math.max(1,f.finish-f.start+1)*W-2}px" title="${esc(p.name)}: ${fmtW(f.start)} to ${fmtW(f.finish+1)}">${(f.finish-f.start+1)*W>110?esc(SNAME(p.stage)):''}</div><div class="bar-after" style="left:${(f.finish+1)*W+6}px">${fmtW(f.finish+1)}</div>`;
    return `<div class="tl-row"><div class="tl-name"><span class="rk">${i+1}</span>${plink(p)}</div><div class="tl-track" style="width:${N*W+120}px">${grid}${bar}</div></div>`}).join('');
  return viewHead('Timeline','Forecast build windows from capacity, priority and dependencies. Striped bars are already in progress. Dotted lines show dependencies.')+
   `<div class="tl"><div class="tl-inner"><div class="tl-row head"><div class="tl-name"><span class="label">Project</span></div><div class="tl-track" style="width:${N*W+120}px">${months}</div></div>${rows}
   <svg class="links" style="left:220px;width:${N*W}px;height:${HH+open.length*RH}px">${links}</svg>
   <div class="tl-today" style="left:220px;top:0;height:${HH+open.length*RH}px" title="This week"></div></div></div>
   <div class="legend">${STAGES.filter(s=>!DONE.has(s.id)).map(s=>`<span>${stageChip(s.id)}</span>`).join('')}<span><span style="display:inline-block;width:2px;height:12px;background:var(--bad);vertical-align:middle"></span> This week</span></div>`;
}

function vCapacity(){
  const {F,used,cap}=forecast(); const ed=canEdit(); const c=S.capacity;
  const N=Math.min(used.length,78);
  const bars=used.slice(0,N).map((u,w)=>`<div style="height:${cap?Math.max(1,u/cap*100):0}%" class="${u<cap-0.01?'free':''}" title="${fmtW(w)}: ${u.toFixed(1)} of ${cap.toFixed(1)} dev-weeks used"></div>`).join('');
  const firstFree=used.findIndex(u=>u<cap-0.01);
  const dis=ed?'':'disabled';
  return viewHead('Development capacity',ed?'Change the team size or the roadmap share and every forecast updates right away.':'Read-only. Product and the head of development set these numbers.')+
  `<div class="capgrid"><section class="panel"><header><h2>Inputs</h2></header><div class="body">
    <div class="field"><label for="c-devs">Developers</label><input id="c-devs" type="number" min="0" step="1" value="${c.devs}" data-cap="devs" ${dis}><span class="hint">Full-time engineers on the team.</span></div>
    <div class="field"><label for="c-pct">Share on roadmap work (%)</label><input id="c-pct" type="number" min="0" max="100" step="5" value="${c.roadmapPct}" data-cap="roadmapPct" ${dis}><span class="hint">The rest goes to maintenance, bugs and support.</span></div>
    <div class="field"><label for="c-rate">Blended cost per dev-week ($)</label><input id="c-rate" type="number" min="0" step="250" value="${c.rate}" data-cap="rate" ${dis}><span class="hint">Turns estimates into cost for budget checks.</span></div>
    <span class="label">Roadmap capacity</span><div class="big">${cap.toFixed(1)} <span class="muted" style="font-size:1rem">dev-weeks / week</span></div>
  </div></section>
  <section class="panel"><header><h2>Capacity used, week by week</h2><span class="muted">${N} weeks</span></header><div class="body">
    <div class="util" role="img" aria-label="Weekly capacity use">${bars}</div>
    <div class="utilx"><span>${fmtW(0)}</span><span>${fmtW(Math.floor(N/2))}</span><span>${fmtW(N-1)}</span></div>
    <p class="muted" style="margin-top:12px">${firstFree<0?'The team is fully booked for the whole forecast.':`The team is fully booked until <b>${fmtW(firstFree)}</b>. After that, capacity opens up for the next project in the backlog.`} Pale bars mean spare capacity, usually because the next projects are waiting on dependencies or have hit their team size limit.</p>
    <span class="label">How the forecast works</span>
    <p class="muted" style="margin:4px 0 0">Each week, roadmap capacity goes first to projects already in development or UAT, then to the backlog in rank order. A project can't start until everything it depends on has shipped, and never takes more developers than its max team size.</p>
  </div></section></div>`;
}

function vAlerts(){
  const ed=canEdit();
  const matrix=`<div class="tablewrap matrix"><table><thead><tr><th>Who</th>${STAGES.map(s=>`<th>${stageChip(s.id)}</th>`).join('')}</tr></thead><tbody>${ROLES.map(r=>`<tr class="${r.id===role?'me':''}"><td><b>${esc(r.name)}</b></td>${STAGES.map(s=>{const on=(S.subs[r.id]||[]).includes(s.id);const can=ed||r.id===role;return `<td><input type="checkbox" aria-label="${esc(r.name)} alerted at ${s.name}" data-sub="${r.id}" data-stage="${s.id}" ${on?'checked':''} ${can?'':'disabled'}></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  return viewHead('Stage alerts','Each team picks the stages it wants to hear about. When a project enters one of them, the team gets an alert. In the full version, alerts go out by email and Slack.')+
  matrix+`<p class="muted" style="font-size:.82rem">${ed?'As an editor you can change any row.':'You can change your own row.'}</p>
  <div class="grid2"><section class="panel"><header><h2>Alert history</h2></header><div class="body"><ul class="list feed">${S.alerts.slice(0,20).map(a=>{const li=alertLi(a);return li.replace('</div></div>',` · to ${a.roles.length?a.roles.map(r=>esc(ROLES.find(x=>x.id===r).name.replace(' (you)',''))).join(', '):'nobody'}</div></div>`)}).join('')}</ul></div></section></div>`;
}

// ---------- project drawer ----------
function drawer(){
  const dr=document.getElementById('drawer'),sc=document.getElementById('scrim');
  const p=openId&&byId(openId);
  if(!p){dr.hidden=true;sc.hidden=true;return}
  const ed=canEdit(); const {F}=forecast(); const f=F[p.id]||{};
  const dis=ed?'':'disabled';
  const others=S.projects.filter(q=>q.id!==p.id&&!p.deps.includes(q.id)&&!wouldCycle(p.id,q.id));
  const unblocks=S.projects.filter(q=>q.deps.includes(p.id));
  const fc=DONE.has(p.stage)?'Shipped':f.unsched?'Can\'t be scheduled':f.inflight?`In flight · ships ${fmtW(f.finish+1)}`:`${fmtW(f.start)} to ${fmtW(f.finish+1)}`;
  const fact=(label,val,input)=>`<div><span class="label">${label}</span><div class="v">${ed&&input?input:val}</div></div>`;
  dr.innerHTML=`<div class="dh"><div style="min-width:0;flex:1">
      ${ed?`<input type="text" id="p-name" data-f="name" value="${esc(p.name)}" class="p-name" aria-label="Project name">`:`<h2>${esc(p.name)}</h2>`}
      <div class="meta">${stageChip(p.stage)}<span>${DONE.has(p.stage)?'Shipped':'Rank '+(S.projects.filter(q=>!DONE.has(q.stage)).indexOf(p)+1)}</span><span>Owner: ${esc(p.owner)}</span></div></div>
      <button class="close" data-act="close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="db">
      <section><span class="label">Stage</span><div class="stepper" style="margin-top:6px">${STAGES.map(s=>`<button data-stage-to="${s.id}" class="${s.id===p.stage?'cur':SI(s.id)<SI(p.stage)?'past':''}" style="--sc:var(--s-${s.id})" ${ed?'':'disabled'}>${s.name}</button>`).join('')}</div>${ed?'<p class="muted" style="font-size:.78rem;margin:6px 0 0">Click a stage to move the project. Teams subscribed to that stage get an alert.</p>':''}</section>
      <section class="panel"><div class="body facts">
        ${fact('Forecast',`<span class="num">${fc}</span>`)}
        ${fact('Owner',esc(p.owner),`<input type="text" id="p-owner" data-f="owner" value="${esc(p.owner)}">`)}
        ${fact('Budget',`<span class="num">${money(p.budget)}</span>`,`<input type="number" id="p-budget" data-f="budget" min="0" step="5000" value="${p.budget}">`)}
        ${fact('Estimate (dev-weeks)',(p.estimate?`<span class="num">${p.estimate}</span>`:NONE),`<input type="number" id="p-est" data-f="estimate" min="0" step="1" value="${p.estimate}">`)}
        ${fact('Estimated cost',`<span class="num">${money(cost(p))}</span> ${budgetPill(p)}`)}
        ${fact('Max team size',`<span class="num">${p.maxDevs} devs</span>`,`<input type="number" id="p-max" data-f="maxDevs" min="1" step="1" value="${p.maxDevs}">`)}
        ${ACTIVE.has(p.stage)?fact('Dev progress',`<span class="num">${p.progress}%</span>`,`<input type="number" id="p-prog" data-f="progress" min="0" max="100" step="5" value="${p.progress}">`):''}
      </div></section>
      <section><span class="label">Summary</span>${ed?`<textarea id="p-sum" data-f="summary" rows="3" style="margin-top:6px">${esc(p.summary)}</textarea>`:`<p style="margin:4px 0 0">${esc(p.summary)||'<span class="muted">No summary yet.</span>'}</p>`}</section>
      <section class="panel"><header><h3>Dependencies</h3></header><div class="body" style="display:grid;gap:10px">
        <div><span class="label">Can't start until these ship</span><div class="deps" style="margin-top:6px">${p.deps.map(id=>{const q=byId(id);return `<span class="chip">${q?`<a href="#project-${q.id}" data-open="${q.id}">${esc(q.name)}</a>`:'?'} ${q?stageChip(q.stage):''} ${ed?`<button class="btn sm ghost" data-undep="${id}" aria-label="Remove dependency">×</button>`:''}</span>`}).join('')||'<span class="muted">None</span>'}</div>
        ${ed?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><select id="p-adddep" aria-label="Add dependency"><option value="">Add a dependency…</option>${others.map(q=>`<option value="${q.id}">${esc(q.name)}</option>`).join('')}</select></div>`:''}</div>
        <div><span class="label">Blocks</span><div class="deps" style="margin-top:6px">${unblocks.map(q=>`<span class="chip"><a href="#project-${q.id}" data-open="${q.id}">${esc(q.name)}</a></span>`).join('')||'<span class="muted">Nothing</span>'}</div></div>
      </div></section>
      <section class="panel"><header><h3>Deliverables by team</h3></header><div class="body" style="overflow-x:auto"><table class="dtable"><thead><tr><th>Deliverable</th><th>Team</th><th>Needed</th><th>Status</th><th>Link</th></tr></thead><tbody>
        ${DELIVS.map(dl=>{const x=p.deliverables[dl.id];const st=delState(p,dl);return `<tr><td><b>${dl.name}</b>${st==='late'?' <span class="pill bad">Overdue</span>':''}</td><td class="muted">${dl.team}</td><td class="muted" style="font-size:.8rem">${dl.when}</td>
        <td>${ed?`<select id="d-${dl.id}-s" data-dl="${dl.id}" data-k="status">${DSTATUS.map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select>`:`<span class="pill ${st==='done'?'ok':st==='late'?'bad':st==='prog'?'warn':'n'}">${DSTATUS.find(s=>s[0]===x.status)[1]}</span>`}</td>
        <td>${ed?`<input type="url" id="d-${dl.id}-l" data-dl="${dl.id}" data-k="link" placeholder="https://" value="${esc(x.link)}">`:x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">Open</a>`:'<span class="muted">None</span>'}</td></tr>`}).join('')}
      </tbody></table></div></section>
      <section class="panel"><header><h3>Stage history</h3></header><div class="body"><ul class="list hist">${[...p.history].reverse().map(h=>`<li><span>Entered ${stageChip(h.to)}${h.by?` <span class="muted">by ${esc(h.by)}</span>`:''}</span><span class="when num muted">${fmtD(h.date)}</span></li>`).join('')||'<li class="muted">Still in Intake.</li>'}</ul></div></section>
      ${ed?`<div><button class="btn danger" data-act="delete">${confirmDel===p.id?'Delete this project? Click again to confirm':'Delete project'}</button></div>`:''}
    </div>`;
  dr.hidden=false;sc.hidden=false;
}
let confirmDel=null;

// ---------- render & routing ----------
let view='home';
function route(){
  const h=location.hash.slice(1);
  const m=h.match(/^project-(\d+)$/);
  if(m){openId=+m[1];if(!byId(openId))openId=null}else{openId=null;if(VIEWS.some(v=>v[0]===h))view=h}
  render();
}
function render(){
  document.getElementById('nav').innerHTML=VIEWS.map(([id,n])=>`<a href="#${id}" ${id===view?'aria-current="page"':''}>${n}</a>`).join('');
  const sel=document.getElementById('role');
  sel.innerHTML=ROLES.map(r=>`<option value="${r.id}" ${r.id===role?'selected':''}>${r.name}${r.edit?'':' (view only)'}</option>`).join('');
  const fn={home:vHome,backlog:vBacklog,board:vBoard,timeline:vTimeline,capacity:vCapacity,alerts:vAlerts}[view];
  document.getElementById('main').innerHTML=fn();
  drawer();
}
function closeDrawer(){openId=null;confirmDel=null;history.replaceState(null,'','#'+view);drawer()}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target;
  const op=t.closest('[data-open]');
  if(op&&!t.closest('button')){e.preventDefault();openId=+op.dataset.open;confirmDel=null;history.replaceState(null,'','#project-'+openId);drawer();document.getElementById('drawer').scrollTop=0;return}
  const mv=t.closest('[data-move]');
  if(mv&&canEdit()){const id=+mv.dataset.move,dir=+mv.dataset.dir;const open=S.projects.filter(p=>!DONE.has(p.stage));const i=open.findIndex(p=>p.id===id);const j=i+dir;if(j<0||j>=open.length)return;const a=S.projects.indexOf(open[i]),b=S.projects.indexOf(open[j]);[S.projects[a],S.projects[b]]=[S.projects[b],S.projects[a]];save();render();return}
  const st=t.closest('[data-stage-to]'); if(st){setStage(byId(openId),st.dataset.stageTo);return}
  const ud=t.closest('[data-undep]'); if(ud&&canEdit()){const p=byId(openId);p.deps=p.deps.filter(x=>x!==+ud.dataset.undep);save();render();return}
  const act=t.closest('[data-act]')?.dataset.act;
  if(act==='close'||t.id==='scrim'){closeDrawer();return}
  if(act==='add'&&canEdit()){const id=S.nextId++;S.projects.push({id,name:'New project',stage:'intake',progress:0,owner:'Unassigned',budget:0,estimate:0,maxDevs:3,deps:[],summary:'',history:[],deliverables:del()});save();openId=id;history.replaceState(null,'','#project-'+id);render();setTimeout(()=>document.getElementById('p-name')?.select(),0);return}
  if(act==='delete'&&canEdit()){if(confirmDel!==openId){confirmDel=openId;drawer();return}const id=openId;S.projects=S.projects.filter(p=>p.id!==id);S.projects.forEach(p=>p.deps=p.deps.filter(x=>x!==id));S.alerts=S.alerts.filter(a=>a.pid!==id);save();closeDrawer();render();toast('Project deleted.');return}
  if(act==='reset'){S=seed();save();openId=null;render();toast('Sample data restored.');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeDrawer();if(e.key==='Enter'&&e.target.matches('.card[data-open]'))e.target.click()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='role'){role=t.value;try{localStorage.setItem(KEY+'-role',role)}catch(_){};const h=R().home;if(!openId){view=h;history.replaceState(null,'','#'+view)}render();toast(`Now viewing as ${R().name}.`);return}
  if(!canEdit()&&!t.dataset.sub)return;
  const p=openId&&byId(openId);
  if(t.dataset.f&&p){const k=t.dataset.f;let v=t.value;if(t.type==='number'){v=Math.max(0,+v||0);if(k==='progress')v=Math.min(100,v);if(k==='maxDevs')v=Math.max(1,v)}p[k]=v;save();render();return}
  if(t.id==='p-adddep'&&p&&t.value){const id=+t.value;if(!wouldCycle(p.id,id)){p.deps.push(id);save();render()}return}
  if(t.dataset.dl&&p){p.deliverables[t.dataset.dl][t.dataset.k]=t.value;save();render();return}
  if(t.dataset.cap){let v=Math.max(0,+t.value||0);if(t.dataset.cap==='roadmapPct')v=Math.min(100,v);S.capacity[t.dataset.cap]=v;save();render();setTimeout(()=>document.getElementById(t.id)?.focus(),0);return}
  if(t.dataset.sub){const r=t.dataset.sub;if(!(canEdit()||r===role))return;const set=new Set(S.subs[r]||[]);t.checked?set.add(t.dataset.stage):set.delete(t.dataset.stage);S.subs[r]=[...set];save();toast('Alert preferences saved.');return}
});
// drag and drop on the stage board
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-col]');if(col&&canEdit()){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-col]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('[data-col]');if(!col)return;e.preventDefault();col.classList.remove('over');const p=byId(+e.dataTransfer.getData('text/plain'));if(p)setStage(p,col.dataset.col)});
window.addEventListener('hashchange',route);
if(!location.hash)view=R().home;
route();
</script>
